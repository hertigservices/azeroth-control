<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Azeroth Control</title>
<!-- No webfont link on purpose: this panel must render with no network at
     all, and a local tool should not tell a third party each time it opens.
     The stacks below name the designed face first, so it is used if it is
     installed locally, then fall back through faces Windows ships with. -->
<style>
:root{
  --bg:#F2F4F7; --surface:#FFFFFF; --surface-2:#E8ECF2; --surface-3:#DDE3EB;
  --text:#131922; --text-dim:#5A6472; --text-faint:#8B95A3;
  --border:#D3DAE4; --border-strong:#B9C3D0;
  --accent:#0E7C86; --accent-soft:#D6EDEF; --gold:#8A6224;
  --ok:#1B8F2E; --warn:#D96B00; --bad:#C42B2B;
  --q0:#8A8A8A; --q1:#2A3038; --q2:#1B8F2E; --q3:#0063C4;
  --q4:#8B2BD4; --q5:#D96B00; --q6:#9C7B3A; --q7:#0088B8;
  --shadow:0 1px 2px rgba(16,24,40,.06), 0 8px 24px -12px rgba(16,24,40,.18);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0E141C; --surface:#16202C; --surface-2:#1E2A38; --surface-3:#263546;
    --text:#E4EAF2; --text-dim:#8A97A8; --text-faint:#67748A;
    --border:#2A3746; --border-strong:#3A4B5E;
    --accent:#3FD0C9; --accent-soft:#12333A; --gold:#D9A85C;
    --ok:#3FE03F; --warn:#FF9A2E; --bad:#FF6B6B;
    --q0:#9D9D9D; --q1:#F2F5F9; --q2:#3FE03F; --q3:#3D9BFF;
    --q4:#B96BFF; --q5:#FF9A2E; --q6:#E6CC80; --q7:#3FD6FF;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 24px -12px rgba(0,0,0,.6);
  }
}
:root[data-theme="dark"]{
  --bg:#0E141C; --surface:#16202C; --surface-2:#1E2A38; --surface-3:#263546;
  --text:#E4EAF2; --text-dim:#8A97A8; --text-faint:#67748A;
  --border:#2A3746; --border-strong:#3A4B5E;
  --accent:#3FD0C9; --accent-soft:#12333A; --gold:#D9A85C;
  --ok:#3FE03F; --warn:#FF9A2E; --bad:#FF6B6B;
  --q0:#9D9D9D; --q1:#F2F5F9; --q2:#3FE03F; --q3:#3D9BFF;
  --q4:#B96BFF; --q5:#FF9A2E; --q6:#E6CC80; --q7:#3FD6FF;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 24px -12px rgba(0,0,0,.6);
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--text);
  font-family:"IBM Plex Sans",system-ui,-apple-system,Segoe UI,sans-serif;font-size:15px;line-height:1.5;
  -webkit-font-smoothing:antialiased}
.app{display:flex;flex-direction:column;height:100vh;height:100dvh}
header{flex:0 0 auto;background:var(--surface);border-bottom:1px solid var(--border);
  box-shadow:var(--shadow);position:relative;z-index:5}
.head-inner{max-width:1240px;margin:0 auto;padding:16px 22px 0;display:flex;flex-direction:column;gap:14px}
.brandrow{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap}
.brand{font-family:"Chakra Petch","Segoe UI Semibold","Segoe UI",system-ui,sans-serif;font-weight:700;font-size:20px;letter-spacing:.02em;margin:0}
.brand em{font-style:normal;color:var(--accent)}
.brandmeta{color:var(--text-faint);font-size:12.5px;letter-spacing:.04em;text-transform:uppercase;
  font-family:"Chakra Petch","Segoe UI Semibold","Segoe UI",system-ui,sans-serif;font-weight:500}
.promptwrap{display:flex;align-items:center;background:var(--surface-2);border:1px solid var(--border-strong);
  border-radius:8px;overflow:hidden;transition:border-color .15s,box-shadow .15s}
.promptwrap:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.promptwrap[hidden]{display:none}
.caret{padding:0 4px 0 14px;color:var(--accent);font-size:19px;font-weight:600;user-select:none;
  font-family:"IBM Plex Mono",Consolas,"Cascadia Mono",ui-monospace,monospace}
#q{flex:1;min-width:0;background:transparent;border:0;outline:0;color:var(--text);
  font-family:"IBM Plex Mono",Consolas,"Cascadia Mono",ui-monospace,monospace;font-size:16px;padding:13px 8px 13px 2px}
#q::placeholder{color:var(--text-faint)}
.clearbtn{background:none;border:0;color:var(--text-faint);cursor:pointer;padding:0 14px;font-size:20px}
.clearbtn:hover{color:var(--text)}
.kbd{font-family:"IBM Plex Mono",Consolas,"Cascadia Mono",ui-monospace,monospace;font-size:11px;color:var(--text-faint);border:1px solid var(--border);
  border-radius:4px;padding:2px 6px;margin-right:10px;background:var(--surface)}
nav{display:flex;gap:2px;overflow-x:auto;scrollbar-width:thin}
.tab{appearance:none;background:none;border:0;border-bottom:2px solid transparent;cursor:pointer;
  padding:11px 15px 10px;color:var(--text-dim);white-space:nowrap;font-family:"Chakra Petch","Segoe UI Semibold","Segoe UI",system-ui,sans-serif;
  font-weight:600;font-size:14px;letter-spacing:.02em;display:flex;align-items:center;gap:8px}
.tab:hover{color:var(--text)}
.tab[aria-selected="true"]{color:var(--accent);border-bottom-color:var(--accent)}
.tab .n{font-family:"IBM Plex Mono",Consolas,"Cascadia Mono",ui-monospace,monospace;font-size:11px;font-variant-numeric:tabular-nums;
  background:var(--surface-2);color:var(--text-faint);padding:2px 6px;border-radius:10px;font-weight:500}
.tab[aria-selected="true"] .n{background:var(--accent-soft);color:var(--accent)}
#filters{display:flex;flex-wrap:wrap;align-items:flex-end;gap:12px;background:var(--surface-2);
  border-top:1px solid var(--border);padding:11px 22px;margin:0 -22px}
#filters:empty{display:none}
.fgroup{display:flex;flex-direction:column;gap:4px}
.fgroup>span{font-family:"Chakra Petch","Segoe UI Semibold","Segoe UI",system-ui,sans-serif;font-size:10.5px;font-weight:600;letter-spacing:.07em;
  text-transform:uppercase;color:var(--text-faint)}
.fgroup select,.fgroup input{background:var(--surface);color:var(--text);border:1px solid var(--border-strong);
  border-radius:6px;padding:6px 8px;font-family:"IBM Plex Sans","Segoe UI",system-ui,sans-serif;font-size:13px;min-height:32px}
.fgroup select{cursor:pointer;max-width:220px}
.fgroup input{width:64px;font-family:"IBM Plex Mono",Consolas,"Cascadia Mono",ui-monospace,monospace;font-variant-numeric:tabular-nums}
.rangewrap{display:flex;align-items:center;gap:6px}
.rangewrap b{color:var(--text-faint);font-weight:400}
.spacer{flex:1 1 auto}
.resetbtn{background:var(--surface);border:1px solid var(--border-strong);color:var(--text-dim);
  border-radius:6px;padding:7px 12px;cursor:pointer;font-family:"Chakra Petch","Segoe UI Semibold","Segoe UI",system-ui,sans-serif;font-weight:600;
  font-size:12px;letter-spacing:.04em;text-transform:uppercase;min-height:32px}
.resetbtn:hover{color:var(--text);border-color:var(--accent)}
main{flex:1 1 auto;min-height:0;display:flex;flex-direction:column;max-width:1240px;width:100%;
  margin:0 auto;padding:0 22px}
.statusbar{flex:0 0 auto;display:flex;justify-content:space-between;align-items:baseline;gap:12px;
  padding:11px 2px 9px;color:var(--text-dim);font-size:12.5px;flex-wrap:wrap}
.statusbar b{color:var(--text);font-weight:600}
.hint{color:var(--text-faint)}
#viewport{flex:1 1 auto;min-height:0;overflow-y:auto;overflow-x:hidden;border-top:1px solid var(--border);
  position:relative}
#spacer{position:relative;width:100%}
#rows{position:absolute;top:0;left:0;right:0}
.row{display:flex;align-items:center;gap:12px;height:44px;padding:0 10px;border-bottom:1px solid var(--border);
  cursor:pointer}
.row:hover{background:var(--surface-2)}
.row.sel{background:var(--accent-soft)}
.row:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.id{flex:0 0 82px;text-align:right;font-family:"IBM Plex Mono",Consolas,"Cascadia Mono",ui-monospace,monospace;font-size:13px;
  color:var(--text-faint);font-variant-numeric:tabular-nums}
.nm{flex:1 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:500}
.meta{flex:0 0 auto;display:flex;gap:6px;align-items:center}
.chip{font-family:"Chakra Petch","Segoe UI Semibold","Segoe UI",system-ui,sans-serif;font-weight:600;font-size:10.5px;letter-spacing:.05em;
  text-transform:uppercase;padding:3px 7px;border-radius:4px;background:var(--surface-2);color:var(--text-dim);
  white-space:nowrap}
.chip.num{font-family:"IBM Plex Mono",Consolas,"Cascadia Mono",ui-monospace,monospace;letter-spacing:0;text-transform:none;font-size:11px;
  font-variant-numeric:tabular-nums}
.cmd{flex:0 0 auto;font-family:"IBM Plex Mono",Consolas,"Cascadia Mono",ui-monospace,monospace;font-size:12px;color:var(--text-faint);opacity:0;
  transition:opacity .12s}
.row:hover .cmd,.row.sel .cmd{opacity:1;color:var(--gold)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
#cmdlist{padding:4px 0 40px}
.cmd-card{border-bottom:1px solid var(--border);padding:13px 10px}
.cmd-card:hover{background:var(--surface-2)}
.cmd-head{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.cmd-name{font-family:"IBM Plex Mono",Consolas,"Cascadia Mono",ui-monospace,monospace;font-size:14.5px;font-weight:600;color:var(--accent);cursor:pointer}
.cmd-name:hover{text-decoration:underline}
.sec{font-family:"Chakra Petch","Segoe UI Semibold","Segoe UI",system-ui,sans-serif;font-size:10.5px;font-weight:700;letter-spacing:.06em;
  text-transform:uppercase;padding:3px 8px;border-radius:4px}
.sec0{background:var(--surface-3);color:var(--text-dim)}
.sec1{background:var(--accent-soft);color:var(--accent)}
.sec2{background:var(--surface-3);color:var(--warn)}
.sec3{background:var(--surface-3);color:var(--q4)}
.cmd-help{margin:9px 0 0;color:var(--text-dim);font-size:13.5px;white-space:pre-wrap;
  font-family:"IBM Plex Mono",Consolas,"Cascadia Mono",ui-monospace,monospace;line-height:1.62;max-width:78ch;overflow-x:auto}
.empty{padding:56px 10px;text-align:center;color:var(--text-faint)}
.empty .big{font-family:"Chakra Petch","Segoe UI Semibold","Segoe UI",system-ui,sans-serif;font-size:17px;font-weight:600;color:var(--text-dim);
  margin-bottom:6px}

/* ---------- dashboard ---------- */
#dash{padding:18px 0 60px;overflow-y:auto}
.dgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(178px,1fr));gap:12px;margin-bottom:22px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:14px 15px;
  display:flex;flex-direction:column;gap:7px}
.card .lab{font-family:"Chakra Petch","Segoe UI Semibold","Segoe UI",system-ui,sans-serif;font-size:10.5px;font-weight:600;letter-spacing:.08em;
  text-transform:uppercase;color:var(--text-faint)}
.card .val{font-family:"Chakra Petch","Segoe UI Semibold","Segoe UI",system-ui,sans-serif;font-size:20px;font-weight:700;line-height:1.1}
.card .sub{font-family:"IBM Plex Mono",Consolas,"Cascadia Mono",ui-monospace,monospace;font-size:11.5px;color:var(--text-faint)}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:7px;vertical-align:1px}
.dot.up{background:var(--ok)} .dot.down{background:var(--bad)} .dot.warn{background:var(--warn)}
h2.sect{font-family:"Chakra Petch","Segoe UI Semibold","Segoe UI",system-ui,sans-serif;font-size:13px;font-weight:700;letter-spacing:.09em;
  text-transform:uppercase;color:var(--text-faint);margin:26px 0 11px;padding-bottom:7px;
  border-bottom:1px solid var(--border)}
.btnrow{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:6px}
.btn{appearance:none;border:1px solid var(--border-strong);background:var(--surface);color:var(--text);
  border-radius:7px;padding:10px 16px;cursor:pointer;font-family:"Chakra Petch","Segoe UI Semibold","Segoe UI",system-ui,sans-serif;font-weight:600;
  font-size:13px;letter-spacing:.03em}
.btn:hover:not(:disabled){border-color:var(--accent);color:var(--accent)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--bg)}
.btn.primary:hover:not(:disabled){filter:brightness(1.08);color:var(--bg)}
.btn.danger:hover:not(:disabled){border-color:var(--bad);color:var(--bad)}
.setgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px}
.setrow{background:var(--surface);border:1px solid var(--border);border-radius:9px;padding:12px 14px;
  display:flex;flex-direction:column;gap:8px}
.setrow .lab{font-family:"Chakra Petch","Segoe UI Semibold","Segoe UI",system-ui,sans-serif;font-size:10.5px;font-weight:600;letter-spacing:.07em;
  text-transform:uppercase;color:var(--text-faint)}
.setctl{display:flex;gap:8px;align-items:center}
.setctl input,.setctl select{flex:1 1 auto;min-width:0;background:var(--surface-2);color:var(--text);
  border:1px solid var(--border-strong);border-radius:6px;padding:7px 9px;font-family:"IBM Plex Mono",Consolas,"Cascadia Mono",ui-monospace,monospace;
  font-size:13px;font-variant-numeric:tabular-nums}
.setctl button{flex:0 0 auto;padding:7px 11px;font-size:11.5px}
.note{color:var(--text-faint);font-size:12px;margin:8px 0 0}
#console{background:#0B1017;color:#C8D4E2;border:1px solid var(--border);border-radius:9px;padding:12px 14px;
  font-family:"IBM Plex Mono",Consolas,"Cascadia Mono",ui-monospace,monospace;font-size:12.5px;line-height:1.6;white-space:pre-wrap;
  max-height:230px;overflow:auto;margin-top:10px}
#logbox{background:#0B1017;color:#8FA3B8;border:1px solid var(--border);border-radius:9px;padding:12px 14px;
  font-family:"IBM Plex Mono",Consolas,"Cascadia Mono",ui-monospace,monospace;font-size:12px;line-height:1.55;white-space:pre-wrap;
  max-height:300px;overflow:auto}
/* ---------- addon manager ---------- */
#addonlist{padding:12px 0 60px}
.acard{display:flex;align-items:center;gap:13px;padding:11px 10px;border-bottom:1px solid var(--border)}
.acard:hover{background:var(--surface-2)}
.aname{font-family:"Chakra Petch","Segoe UI Semibold","Segoe UI",system-ui,sans-serif;font-weight:700;font-size:14.5px;flex:0 0 auto;min-width:152px}
.adesc{flex:1 1 auto;min-width:0;color:var(--text-dim);font-size:13px;overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap}
.acat{font-family:"Chakra Petch","Segoe UI Semibold","Segoe UI",system-ui,sans-serif;font-weight:600;font-size:10px;letter-spacing:.06em;
  text-transform:uppercase;padding:3px 7px;border-radius:4px;background:var(--surface-2);
  color:var(--text-dim);flex:0 0 auto}
.astar{color:var(--gold);font-size:11px;font-weight:700;font-family:"Chakra Petch","Segoe UI Semibold","Segoe UI",system-ui,sans-serif;
  letter-spacing:.05em;flex:0 0 auto}
.abtn{flex:0 0 auto;appearance:none;border:1px solid var(--border-strong);background:var(--surface);
  color:var(--text);border-radius:6px;padding:6px 13px;cursor:pointer;
  font-family:"Chakra Petch","Segoe UI Semibold","Segoe UI",system-ui,sans-serif;font-weight:600;font-size:12px;min-width:86px}
.abtn:hover:not(:disabled){border-color:var(--accent);color:var(--accent)}
.abtn:disabled{opacity:.5;cursor:not-allowed}
.abtn.rm{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.abtn.rm:hover:not(:disabled){border-color:var(--bad);color:var(--bad);background:var(--surface)}
.aiface{font-family:"IBM Plex Mono",Consolas,"Cascadia Mono",ui-monospace,monospace;font-size:10.5px;color:var(--text-faint);flex:0 0 auto}
.aiface.bad{color:var(--warn)}

#toast{position:fixed;left:50%;bottom:26px;transform:translate(-50%,14px);background:var(--text);color:var(--bg);
  padding:11px 18px;border-radius:8px;font-family:"IBM Plex Mono",Consolas,"Cascadia Mono",ui-monospace,monospace;font-size:13.5px;font-weight:500;
  opacity:0;pointer-events:none;transition:opacity .18s,transform .18s;z-index:50;box-shadow:var(--shadow)}
#toast.on{opacity:1;transform:translate(-50%,0)}
@media (max-width:820px){
  .head-inner{padding:14px 14px 0} #filters{padding:11px 14px;margin:0 -14px}
  main{padding:0 14px} .id{flex-basis:64px;font-size:12px} .cmd{display:none} .brandmeta{display:none}
  .adesc{display:none} .aname{min-width:0}
}
/* Bots tab. Every row carries a long explanation on hover, so the popover is a
   single element positioned by script rather than one nested per card: the cards
   sit in a grid inside #viewport, which scrolls and clips overflow-x, and a
   nested absolute popover gets cut off at the pane edge. */
#bottip{position:fixed;z-index:60;max-width:420px;background:var(--surface);
  border:1px solid var(--border-strong);border-radius:9px;padding:11px 13px;
  box-shadow:0 10px 30px rgba(0,0,0,.30);color:var(--text);font-size:12.5px;
  line-height:1.55;pointer-events:none;opacity:0;visibility:hidden;transition:opacity .1s}
#bottip.on{opacity:1;visibility:visible}
#bottip b{display:block;margin:0 0 5px;font-family:"Chakra Petch","Segoe UI Semibold","Segoe UI",system-ui,sans-serif;font-size:10.5px;
  font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--accent)}
#bottip code{font-family:"IBM Plex Mono",Consolas,"Cascadia Mono",ui-monospace,monospace;font-size:11.5px;color:var(--text-dim)}
.botrow{position:relative}
.botrow .why{position:absolute;top:9px;right:10px;width:17px;height:17px;border-radius:50%;
  border:1px solid var(--border-strong);color:var(--text-faint);font-size:10.5px;
  line-height:15px;text-align:center;cursor:help;background:var(--surface)}
.botrow:hover .why,.botrow .why:focus-visible{border-color:var(--accent);color:var(--accent)}
.botcmd{font-family:"IBM Plex Mono",Consolas,"Cascadia Mono",ui-monospace,monospace;font-size:12px;color:var(--accent);
  background:var(--surface-2);border:1px solid var(--border);border-radius:6px;
  padding:6px 8px;margin:0;overflow-x:auto;white-space:nowrap}
.gates{display:flex;flex-wrap:wrap;gap:5px;margin:0}
.gate{font-family:"IBM Plex Mono",Consolas,"Cascadia Mono",ui-monospace,monospace;font-size:10.5px;padding:2px 6px;border-radius:4px;
  background:var(--surface-2);color:var(--text-faint);border:1px solid var(--border)}
.gate b{color:var(--text-dim);font-weight:600}
.nomen{border-collapse:collapse;width:100%;max-width:860px;font-size:13px;margin:0 0 18px}
.nomen td{border-bottom:1px solid var(--border);padding:7px 12px 7px 0;vertical-align:top;
  color:var(--text-dim)}
.nomen td.k{font-family:"IBM Plex Mono",Consolas,"Cascadia Mono",ui-monospace,monospace;font-size:12.5px;color:var(--accent);
  white-space:nowrap;width:1%}
.nomen tr:last-child td{border-bottom:0}
.nomenwrap{overflow-x:auto}
.speccols{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px;
  max-width:1100px}
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="head-inner">
      <div class="brandrow">
        <h1 class="brand">Azeroth <em>Control</em></h1>
        <span class="brandmeta" id="brandmeta">local realm panel</span>
      </div>
      <div class="promptwrap" id="promptwrap" hidden>
        <span class="caret">.</span>
        <input id="q" type="search" autocomplete="off" spellcheck="false"
               placeholder="Search by name or paste an ID&hellip;" aria-label="Search">
        <span class="kbd" id="kbdhint">/</span>
        <button class="clearbtn" id="clear" type="button" aria-label="Clear search" hidden>&times;</button>
      </div>
      <nav id="tabs" role="tablist"></nav>
      <div id="filters"></div>
    </div>
  </header>
  <main>
    <div class="statusbar" id="statusbar" hidden>
      <div id="count"></div>
      <div class="hint">Click a row to copy &middot; <b>/</b> search &middot; <b>[</b> <b>]</b> tabs</div>
    </div>
    <div id="viewport" tabindex="-1">
      <div id="dash"></div>
      <div id="ratelist" hidden></div>
      <div id="trainerlist" hidden></div>
      <div id="botlist" hidden></div>
      <div id="addonlist" hidden></div>
      <div id="spacer" hidden><div id="rows"></div></div>
      <div id="cmdlist" hidden></div>
    </div>
  </main>
</div>
<div id="toast" role="status" aria-live="polite"></div>

<script>
(function(){
"use strict";
var DATA = null, loading = false;

var QUAL=['Poor','Common','Uncommon','Rare','Epic','Legendary','Artifact','Heirloom'];
var RANK=['Normal','Elite','Rare Elite','Boss','Rare'];
var ICLASS={0:'Consumable',1:'Container',2:'Weapon',3:'Gem',4:'Armor',5:'Reagent',6:'Projectile',
  7:'Trade Goods',8:'Generic',9:'Recipe',10:'Money',11:'Quiver',12:'Quest',13:'Key',14:'Permanent',
  15:'Miscellaneous',16:'Glyph'};
var CTYPE={0:'Unspecified',1:'Beast',2:'Dragonkin',3:'Demon',4:'Elemental',5:'Giant',6:'Undead',
  7:'Humanoid',8:'Critter',9:'Mechanical',10:'Not Specified',11:'Totem',12:'Non-combat Pet',13:'Gas Cloud'};
var GOTYPE={0:'Door',1:'Button',2:'Questgiver',3:'Chest',4:'Binder',5:'Generic',6:'Trap',7:'Chair',

function loadLog(){
  var box=document.getElementById('logbox'); if(!box)return;
  api('/api/log?n=140').then(function(r){
    if(!document.getElementById('logbox'))return;
    document.getElementById('logbox').textContent=(r.lines||[]).join('\n')||'(empty)';
    document.getElementById('logbox').scrollTop=999999;
  }).catch(function(){ if(box) box.textContent='(log unavailable)'; });

  var c=document.getElementById('console'); if(!c)return;

function busy(on){
  Array.prototype.forEach.call($dash.querySelectorAll('.btn'),function(b){b.disabled=on;});
}
$dash.addEventListener('click',function(e){
  var t=e.target;
  if(t.dataset.act){
    var act=t.dataset.act;
    if(act==='stop'&&!confirm('Stop the server? Characters are saved first.'))return;
    busy(true); showConsole(['working...']);
    api('/api/'+act,{auth:true}).then(function(r){
      showConsole(r.log); busy(false); refresh();
    }).catch(function(err){ showConsole(['request failed: '+err]); busy(false); });
    return;
  }
  if(t.dataset.phase){
    busy(true);
    api('/api/phase',{phase:t.dataset.phase}).then(function(r){
      showConsole(r.log); busy(false); refresh(); toast('tier set to '+t.dataset.phase);
    }).catch(function(err){ showConsole(['request failed: '+err]); busy(false); });
    return;
  }
  if(t.dataset.apply){
    var key=t.dataset.apply;
    var inp=$dash.querySelector('[data-set="'+key+'"]'); if(!inp)return;
    busy(true);
    api('/api/setting',{key:key,value:inp.value}).then(function(r){
      showConsole(r.log); busy(false); toast(r.ok?'saved':'not applied'); refresh();
    }).catch(function(err){ showConsole(['request failed: '+err]); busy(false); });
  }
});

        +'Is the Azeroth Control window still open?</div>';

function trArgs(id){

  var t=e.target;

  if(!id||t.disabled)return;
  var wantCopy=!!t.dataset.trcopy;
  trBusy=id;
  api('/api/trainer/run',{id:id,args:trArgs(id)}).then(function(r){
    trBusy=null;

      var cmd=r.copy||(r.log&&r.log[0]);
      if(cmd){ copy(cmd); }

  }).catch(function(err){ trBusy=null; trConsole(['request failed: '+err]); renderTrainer(); });

var BT=null;

// Mirror of bots_build() in control.py, used for the live preview only. Copy sends
// the request and pastes what the server answers, so the two cannot drift apart in
// the text that actually reaches your chat box - the preview just self-corrects.
function btPreview(c){
  var s=c.cmd;
  (c.args||[]).forEach(function(a){
    var el=$botlist.querySelector('[data-barg="'+c.id+'"][data-k="'+a.key+'"]');
    var v=el?String(el.value).trim():'';
    if(v===''&&a.default!==undefined&&a.default!=='')v=String(a.default);
    s=s.split('{'+a.key+'}').join(v);
  });
  return s.replace(/\s+/g,' ').trim();
}
function btSyncPreview(id){
  var c=(BT&&BT.commands||[]).filter(function(x){return x.id===id;})[0];
  if(!c)return;
  var pre=$botlist.querySelector('[data-bprev="'+id+'"]');
  if(pre)pre.textContent=btPreview(c);
}

var $bottip=null;
function btTipShow(el,id){
  var c=(BT&&BT.commands||[]).filter(function(x){return x.id===id;})[0];
  if(!c)return;
  if(!$bottip){ $bottip=document.createElement('div'); $bottip.id='bottip'; document.body.appendChild($bottip); }
  $bottip.innerHTML='<b>'+esc(c.label)+'</b>'+esc(c.tip||c.desc||'')
    +'<div style="margin-top:7px"><code>'+esc(c.cmd)+'</code></div>';
  $bottip.classList.add('on');
  // Measured after the new text is in, and after a first placement: the box is
  // only as wide as its content up to the 420px cap, so a short tip measured at
  // the previous tip's width would clamp against the wrong number.
  $bottip.style.left='0px'; $bottip.style.top='0px';
  var r=el.getBoundingClientRect(), t=$bottip.getBoundingClientRect();
  var top=r.bottom+8;
  if(top+t.height>window.innerHeight-8) top=Math.max(8, r.top-t.height-8);
  $bottip.style.left=Math.max(8, Math.min(r.left, window.innerWidth-t.width-12))+'px';
  $bottip.style.top=top+'px';
}

/* ---------- codex data (lazy) ---------- */
function ensureData(){
  if(DATA)return Promise.resolve(DATA);
  if(loading)return loading;
  loading=fetch('refdata.json').then(function(r){return r.json();}).then(function(d){
    DATA=d; loading=false; fillCounts(); return d;
  });
  return loading;
}

/* ---------- filters ---------- */
function present(key,idx,names){
  var seen={},rows=(DATA&&DATA[key])||[],i;
  for(i=0;i<rows.length;i++)seen[rows[i][idx]]=true;
  var out=[];for(var k in seen)if(seen.hasOwnProperty(k))out.push(+k);
  out.sort(function(a,b){return a-b;});
  return out.map(function(v){return {v:v,t:(names[v]!==undefined?names[v]:('#'+v))};});
}
function buildFilters(){
  var c=cat();
  if(c.dash){$filters.innerHTML='';return;}
  var html='';
  (c.filters||[]).forEach(function(f){
    var opts=f.opts||(f.optsFrom?present(f.optsFrom[0],f.optsFrom[1],f.optsFrom[2]):[]);
    if(f.kind==='select'){
      var o='<option value="">All</option>';
      opts.forEach(function(x){
        o+='<option value="'+x.v+'"'+(String(state.f[f.id])===String(x.v)?' selected':'')+'>'+esc(x.t)+'</option>';});
      html+='<label class="fgroup"><span>'+esc(f.label)+'</span><select data-f="'+f.id+'">'+o+'</select></label>';
    }else if(f.kind==='range'){
      var lo=state.f[f.id+'_lo'],hi=state.f[f.id+'_hi'];
      html+='<div class="fgroup"><span>'+esc(f.label)+'</span><div class="rangewrap">'
        +'<input type="number" min="0" placeholder="min" data-r="'+f.id+'_lo" value="'+(lo!==undefined?lo:'')+'">'
        +'<b>to</b>'
        +'<input type="number" min="0" placeholder="max" data-r="'+f.id+'_hi" value="'+(hi!==undefined?hi:'')+'">'
        +'</div></div>';
    }
  });
  var so='';(c.sorts||[]).forEach(function(s,i){
    so+='<option value="'+i+'"'+(state.sort===i?' selected':'')+'>'+esc(s.t)+'</option>';});
  html+='<div class="spacer"></div><label class="fgroup"><span>Sort by</span>'
     +'<select data-sort="1">'+so+'</select></label>';
  if(activeCount()>0)html+='<button class="resetbtn" type="button" data-reset="1">Reset</button>';
  $filters.innerHTML=html;
}
function activeCount(){var n=0;for(var k in state.f)if(state.f.hasOwnProperty(k)&&state.f[k]!==undefined)n++;return n;}
$filters.addEventListener('change',function(e){
  var t=e.target;
  if(t.dataset.sort){state.sort=+t.value;recompute(false);return;}
  if(t.dataset.f!==undefined){
    if(t.value==='')delete state.f[t.dataset.f];else state.f[t.dataset.f]=+t.value;
    recompute(true);return;}
  if(t.dataset.r!==undefined){
    if(t.value==='')delete state.f[t.dataset.r];else state.f[t.dataset.r]=+t.value;
    recompute(true);}
});
$filters.addEventListener('click',function(e){
  if(e.target.dataset&&e.target.dataset.reset){state.f={};state.sort=0;recompute(true);}
});

/* ---------- pipeline ---------- */
function nameIdx(key){
  if(lc[key])return lc[key];
  var src=(DATA&&DATA[key])||[],out=new Array(src.length),isCmd=(key==='commands');
  for(var i=0;i<src.length;i++)out[i]=String(isCmd?src[i][0]:src[i][1]).toLowerCase();
  lc[key]=out;return out;
}
function search(){
  var key=state.cat,src=(DATA&&DATA[key])||[],term=state.q.trim().toLowerCase();
  if(!term)return src.slice();
  var names=nameIdx(key),pre=[],sub=[],i,p;
  if(/^\d+$/.test(term)&&key!=='commands'){
    var want=parseInt(term,10),exact=[],partial=[];
    for(i=0;i<src.length;i++){
      if(src[i][0]===want)exact.push(src[i]);
      else if(String(src[i][0]).indexOf(term)===0)partial.push(src[i]);}
    for(i=0;i<src.length;i++)if(names[i].indexOf(term)!==-1)sub.push(src[i]);
    return exact.concat(partial,sub);
  }
  for(i=0;i<src.length;i++){p=names[i].indexOf(term);
    if(p===0)pre.push(src[i]);else if(p>0)sub.push(src[i]);}
  return pre.concat(sub);
}
function filter(rows){
  var c=cat();
  (c.filters||[]).forEach(function(f){
    if(f.kind==='select'){
      var v=state.f[f.id];if(v===undefined)return;
      rows=rows.filter(f.custom?function(r){return f.test(r,v);}:function(r){return r[f.idx]===v;});
    }else if(f.kind==='range'){
      var lo=state.f[f.id+'_lo'],hi=state.f[f.id+'_hi'];
      if(lo===undefined&&hi===undefined)return;
      var a=f.idx,b=(f.idx2!==undefined?f.idx2:f.idx);
      rows=rows.filter(function(r){
        if(lo!==undefined&&r[b]<lo)return false;
        if(hi!==undefined&&r[a]>hi)return false;
        return true;});
    }
  });
  return rows;
}
function recompute(refreshBar){
  var c=cat();
  if(c.dash||c.addons||c.rates||c.trainer||c.bots)return;
  var rows=filter(search());
  var s=(c.sorts||[])[state.sort];
  if(s&&(state.sort>0||!state.q))rows=rows.slice().sort(s.f);
  state.results=rows;state.sel=-1;
  if(refreshBar)buildFilters();
  $vp.scrollTop=0;render();
}
function render(){
  var c=cat();
  if(c.dash)return;
  var n=state.results.length,tot=((DATA&&DATA[state.cat])||[]).length;
  var bits='<b>'+fmt(n)+'</b> of '+fmt(tot)+' '+c.label.toLowerCase();
  if(state.q)bits+=' matching &ldquo;'+esc(state.q)+'&rdquo;';
  if(activeCount())bits+=' &middot; '+activeCount()+' filter'+(activeCount()>1?'s':'')+' active';
  $count.innerHTML=bits;$clear.hidden=!state.q;
  if(state.cat==='commands'){$spacer.hidden=true;$cmdlist.hidden=false;renderCmds();}
  else{$cmdlist.hidden=true;$spacer.hidden=false;renderVirtual();}
}
function emptyHtml(){return '<div class="empty"><div class="big">Nothing matches</div>'
  +'Try a shorter word, a numeric ID, or reset the filters.</div>';}
function renderCmds(){
  var r=state.results;
  if(!r.length){$cmdlist.innerHTML=emptyHtml();return;}
  var lim=Math.min(r.length,400),h='';
  for(var i=0;i<lim;i++){
    var row=r[i],sec=row[1]<4?row[1]:3;
    h+='<div class="cmd-card"><div class="cmd-head">'
     +'<span class="cmd-name" data-cmd="'+esc('.'+row[0])+'">.'+esc(row[0])+'</span>'
     +'<span class="sec sec'+sec+'">'+(row[1]===0?'Player':'GM level '+row[1])+'</span></div>'
     +(row[2]?'<p class="cmd-help">'+esc(row[2])+'</p>':'')+'</div>';
  }
  if(r.length>lim)h+='<div class="empty">Showing first '+lim+' of '+fmt(r.length)+'. Keep typing to narrow.</div>';
  $cmdlist.innerHTML=h;
}
function renderVirtual(){
  var c=cat(),r=state.results,n=r.length;
  $spacer.style.height=(n*ROWH)+'px';
  if(!n){$rows.innerHTML=emptyHtml();$rows.style.transform='none';return;}
  var top=$vp.scrollTop,vh=$vp.clientHeight;
  var first=Math.max(0,Math.floor(top/ROWH)-PAD),last=Math.min(n,Math.ceil((top+vh)/ROWH)+PAD);
  var h='';
  for(var i=first;i<last;i++){
    var row=r[i],chips=c.chips?c.chips(row):[],ch='';
    for(var j=0;j<chips.length;j++){
      var cp=chips[j];if(!cp||!cp.t)continue;
      var st=(cp.q!==undefined)?' style="color:var(--q'+cp.q+')"':'';
      ch+='<span class="chip '+(cp.cls||'')+'"'+st+'>'+esc(cp.t)+'</span>';}
    var ns=c.color?' style="color:'+c.color(row)+'"':'';
    h+='<div class="row'+(i===state.sel?' sel':'')+'" data-i="'+i+'" tabindex="0" role="button">'
     +'<span class="id">'+row[0]+'</span>'
     +'<span class="nm"'+ns+'>'+esc(row[1]||'(unnamed)')+'</span>'
     +'<span class="meta">'+ch+'</span>'
     +'<span class="cmd">'+esc(c.build(row))+'</span></div>';
  }
  $rows.innerHTML=h;$rows.style.transform='translateY('+(first*ROWH)+'px)';
}
function copy(text){
  var done=function(){toast(text+'   copied');};
  if(navigator.clipboard&&navigator.clipboard.writeText)
    navigator.clipboard.writeText(text).then(done,function(){fb(text,done);});
  else fb(text,done);
}
function fb(text,done){
  var ta=document.createElement('textarea');ta.value=text;ta.setAttribute('readonly','');
  ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);ta.select();
  try{document.execCommand('copy');done();}catch(e){toast('Press Ctrl+C: '+text);}
  document.body.removeChild(ta);
}
var deb;
function onSearch(){
  state.q=$q.value;
  // The addons tab has its own dataset; recompute() only understands the codex.
  if(cat().addons){ renderAddons(); } else { recompute(false); }
}
$q.addEventListener('input',function(){clearTimeout(deb);deb=setTimeout(onSearch,90);});
$clear.addEventListener('click',function(){$q.value='';onSearch();$q.focus();});
$vp.addEventListener('scroll',function(){if(state.cat!=='commands'&&!cat().dash)renderVirtual();});
window.addEventListener('resize',function(){if(state.cat!=='commands'&&!cat().dash)renderVirtual();});
$rows.addEventListener('click',function(e){
  var el=e.target.closest?e.target.closest('.row'):null;if(!el)return;
  var row=state.results[+el.dataset.i];if(!row)return;
  state.sel=+el.dataset.i;copy(cat().build(row));renderVirtual();});
$rows.addEventListener('keydown',function(e){
  if(e.key!=='Enter'&&e.key!==' ')return;
  var el=e.target.closest?e.target.closest('.row'):null;if(!el)return;
  e.preventDefault();var row=state.results[+el.dataset.i];if(row)copy(cat().build(row));});
$cmdlist.addEventListener('click',function(e){
  var el=e.target.closest?e.target.closest('.cmd-name'):null;if(el)copy(el.dataset.cmd);});
document.addEventListener('keydown',function(e){
  var typing=/^(INPUT|SELECT|TEXTAREA)$/.test(document.activeElement.tagName);
  if(e.key==='/'&&!typing&&!cat().dash){e.preventDefault();$q.focus();$q.select();return;}
  if(e.key==='Escape'&&document.activeElement===$q){$q.value='';state.q='';recompute(false);return;}
  if((e.key==='['||e.key===']')&&!typing){
    var idx=0;for(var i=0;i<CATS.length;i++)if(CATS[i].key===state.cat)idx=i;
    idx=(idx+(e.key===']'?1:CATS.length-1))%CATS.length;setCat(CATS[idx].key);}
});

function setCat(key){
  state.cat=key;state.f={};state.sort=0;state.sel=-1;
  syncTabs();
  var c=cat();
  if(c.dash){
    $dash.hidden=false;$addonlist.hidden=true;$spacer.hidden=true;$cmdlist.hidden=true;
    $trainerlist.hidden=true;$ratelist.hidden=true;$botlist.hidden=true;
    $statusbar.hidden=true;$promptwrap.hidden=true;$filters.innerHTML='';
    renderDash();
    if(!pollTimer)pollTimer=setInterval(refresh,6000);
    refresh();
    return;
  }
  if(pollTimer){clearInterval(pollTimer);pollTimer=null;}
  if(c.trainer){
    $dash.hidden=true;$trainerlist.hidden=false;$ratelist.hidden=true;$addonlist.hidden=true;
    $spacer.hidden=true;$cmdlist.hidden=true;
    $statusbar.hidden=false;$promptwrap.hidden=true;$filters.innerHTML='';
    renderTrainer();
    loadTrainer().then(renderTrainer)
      .catch(function(){$count.textContent='Control service unreachable';});
    return;
  }
  $trainerlist.hidden=true;
  if(c.bots){
    $dash.hidden=true;$botlist.hidden=false;$ratelist.hidden=true;$addonlist.hidden=true;
    $spacer.hidden=true;$cmdlist.hidden=true;
    $statusbar.hidden=false;$promptwrap.hidden=true;$filters.innerHTML='';
    renderBots();
    loadBots().then(renderBots)
      .catch(function(){$count.textContent='Control service unreachable';});
    return;
  }
  $botlist.hidden=true;
  if(c.rates){
    $dash.hidden=true;$ratelist.hidden=false;$addonlist.hidden=true;
    $spacer.hidden=true;$cmdlist.hidden=true;
    $statusbar.hidden=false;$promptwrap.hidden=true;$filters.innerHTML='';
    renderRates();
    loadRates().then(renderRates)
      .catch(function(){$count.textContent='Control service unreachable';});
    return;
  }
  $ratelist.hidden=true;
  if(c.addons){
    $dash.hidden=true;$addonlist.hidden=false;$spacer.hidden=true;$cmdlist.hidden=true;
    $statusbar.hidden=false;$promptwrap.hidden=false;
    $count.innerHTML='Loading catalog&hellip;';
    renderAddons();
    loadAddons().then(function(){buildAddonFilters();renderAddons();})
      .catch(function(){$count.textContent='Control service unreachable';});
    return;
  }
  $addonlist.hidden=true;
  $dash.hidden=true;$statusbar.hidden=false;$promptwrap.hidden=false;
  $count.innerHTML='Loading data&hellip;';
  ensureData().then(function(){buildFilters();recompute(false);})
    .catch(function(){$count.textContent='Could not load refdata.json';});
}

setCat('dash');
})();
</script>
</body>
</html>
