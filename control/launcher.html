<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Azeroth Control Launcher</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Inter:wght@400;500;600;700&display=swap">
<style>
/* Design language mined from the archived Ascension launcher bundle
   (ascension-archive/launcher/renderer/assets/CsHqwm6D.css) and their splash.
   Token VALUES are theirs; every rule below is written here. No Ascension
   artwork, logo or font file is used - the display face is Cinzel standing in
   for their Beaufort, and all "art" is a procedural gradient off each realm's
   own accent colour. */
:root{
  --radius:.625rem;
  --background:#121416; --background-alt:#191b1e; --background-alt2:#1c1e21;
  --foreground:#cdcdcd; --foreground-alt:#bebebe; --foreground-dim:#8a8a8a;
  --primary:#c9aa71; --primary-alt:#ad9362;
  --secondary:#1e1e1e; --secondary-alt0:#252525; --secondary-alt:#2b2b2b;
  --secondary-alt2:#353535; --secondary-light:#4b4b4b; --secondary-lighter:#5c5c5c;
  --hairline:#525252;
  --filling-alt2:#0c0e10;
  --launcher-accent:#f5802b; --launcher-accent-secondary:#8c5023;
  --launcher-accent-foreground:#fb8c4b; --launcher-accent-foreground-secondary:#f4b037;
  --launcher-theme:#382d2d; --launcher-theme-dialog:#2a2528;
  --cta-1:#a8622a; --cta-2:#9a5826; --cta-3:#8c5023;
  --ok:#5bd07a; --warn:#f4b037; --bad:#e05555; --idle:#5c5c5c;
  --cta-button-height:4rem; --cta-button-radius:1.5rem;
  --cta-indicator:3rem; --nav-h:4rem; --rail-w:16rem;
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0; background:var(--background); color:var(--foreground);
  font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  font-size:15px; line-height:1.5; -webkit-font-smoothing:antialiased;
  overflow:hidden;
}
button,input,select{font:inherit;color:inherit}
a{color:var(--primary);text-decoration:none}
a:hover{color:var(--launcher-accent-foreground-secondary)}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-track{background:var(--background)}
::-webkit-scrollbar-thumb{background:var(--secondary-alt2);border-radius:5px}
::-webkit-scrollbar-thumb:hover{background:var(--secondary-light)}
.display{font-family:Cinzel,"Times New Roman",serif;font-weight:700;letter-spacing:.02em}
.eyebrow{font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;
  color:var(--foreground-dim)}

/* ---------------------------------------------------------------- shell */
.app{display:grid;grid-template-rows:var(--nav-h) 1fr auto;height:100vh;height:100dvh}

/* navbar: their fixed h-16 bg-secondary bar with a 1px hairline instead of a shadow */
.nav{display:flex;align-items:center;gap:1.5rem;padding:0 1.25rem;
  background:var(--secondary);box-shadow:0 1px 0 0 var(--hairline);z-index:6}
.brand{display:flex;align-items:baseline;gap:.55rem;margin-right:.5rem}
.brand b{font-family:Cinzel,serif;font-size:1.05rem;font-weight:700;letter-spacing:.06em;
  text-transform:uppercase;color:var(--primary)}
.brand span{font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--foreground-dim)}
.navtabs{display:flex;gap:.15rem;margin-right:auto;min-width:0;overflow-x:auto;
  scrollbar-width:none}
.navtabs::-webkit-scrollbar{display:none}
/* The brand and the Hub/Classic buttons are meant to wrap to two lines when the
   bar tightens - that is the compact look, not a squeeze artefact - so they stay
   shrinkable and the window's min_size (see launcher_app.py) is what actually
   keeps the bar above its 1365px floor.  The scroll above is only insurance for
   a future ninth tab. */
.navtab{appearance:none;background:none;border:0;cursor:pointer;padding:.5rem .8rem;border-radius:.35rem;
  font-size:13px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--foreground-alt);
  display:flex;align-items:center;gap:.45rem;transition:color .15s,background .15s}
.navtab:hover{color:#e8e8e8;background:var(--secondary-alt0)}
.navtab[aria-selected="true"]{color:var(--primary);background:var(--secondary-alt)}
.navtab svg{width:1.15rem;height:1.15rem;fill:currentColor}
.navright{display:flex;align-items:center;gap:.85rem}
.pill{display:inline-flex;align-items:center;gap:.45rem;padding:.3rem .7rem;border-radius:999px;
  background:var(--secondary-alt0);border:1px solid rgba(255,255,255,.08);
  font-size:11.5px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--foreground-alt)}
.dot{width:.5rem;height:.5rem;border-radius:50%;background:var(--idle);flex:0 0 auto}
.dot.on{background:var(--ok);box-shadow:0 0 8px rgba(91,208,122,.6)}
.dot.warn{background:var(--warn);box-shadow:0 0 8px rgba(244,176,55,.5)}
.dot.off{background:var(--bad)}
.ghost{appearance:none;background:none;border:1px solid rgba(255,255,255,.12);border-radius:.4rem;
  padding:.35rem .7rem;font-size:11.5px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;
  color:var(--foreground-alt);cursor:pointer;transition:.15s}
.ghost:hover{border-color:var(--primary);color:var(--primary)}

/* ---------------------------------------------------------------- body */
.body{display:grid;grid-template-columns:var(--rail-w) 1fr;min-height:0}
.rail{background:var(--background-alt);border-right:1px solid rgba(255,255,255,.06);
  overflow-y:auto;padding:.9rem .7rem;display:flex;flex-direction:column;gap:.9rem}
.railhead{display:flex;align-items:center;justify-content:space-between;padding:0 .35rem}
.railgroup{display:flex;flex-direction:column;gap:.3rem}
.realm{display:flex;align-items:center;gap:.7rem;padding:.6rem .6rem;border-radius:var(--radius);
  border:1px solid transparent;background:none;cursor:pointer;text-align:left;width:100%;transition:.15s}
.realm:hover{background:var(--secondary-alt0)}
.realm[aria-current="true"]{background:var(--secondary-alt);border-color:rgba(201,170,113,.35)}
.realm .crest{width:2.4rem;height:2.4rem;border-radius:.5rem;flex:0 0 auto;position:relative;
  display:grid;place-items:center;font-family:Cinzel,serif;font-weight:700;font-size:1rem;color:#14100c;
  background:linear-gradient(145deg,var(--a) 0%,color-mix(in srgb,var(--a) 45%,#000) 100%);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.28),0 2px 6px rgba(0,0,0,.5)}
.realm.dim .crest{filter:grayscale(1) brightness(.55)}
.realm .rt{min-width:0;flex:1}
.realm .rn{font-size:13.5px;font-weight:600;color:var(--foreground);white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis}
.realm.dim .rn{color:var(--foreground-dim)}
.realm .rs{font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--foreground-dim)}
.realm[aria-current="true"] .rn{color:var(--primary)}

/* a nested realm is a MODE of the one above it - same client, same binaries,
   a different worldserver conf - so it hangs off the parent instead of
   standing beside it as if it were a separate stack */
.realm.nested{padding-left:1.9rem;position:relative}
.realm.nested::before{content:'';position:absolute;left:1.15rem;top:-.3rem;bottom:50%;
  width:1px;background:rgba(255,255,255,.14)}
.realm.nested::after{content:'';position:absolute;left:1.15rem;top:50%;width:.5rem;height:1px;
  background:rgba(255,255,255,.14)}
.realm.nested .crest{width:1.7rem;height:1.7rem;font-size:.78rem;border-radius:.4rem}
.realm.nested .rn{font-size:12.5px;font-weight:500}
.realm.nested .rs{font-size:9.5px}

.main{min-width:0;overflow-y:auto;position:relative}
.view{display:none}
.view.on{display:block}

/* hero - their news-shell pattern: art block, dark gradient down to page bg */
.hero{position:relative;min-height:15rem;display:flex;align-items:flex-end;padding:1.6rem 2rem 1.4rem;
  overflow:hidden;border-bottom:1px solid rgba(255,255,255,.06)}
.hero .art{position:absolute;inset:0;
  background:
    radial-gradient(115% 130% at 12% 0%,color-mix(in srgb,var(--a) 42%,transparent) 0%,transparent 62%),
    radial-gradient(90% 110% at 92% 15%,color-mix(in srgb,var(--a) 22%,transparent) 0%,transparent 55%),
    linear-gradient(155deg,var(--launcher-theme) 0%,var(--filling-alt2) 70%)}
.hero .art::after{content:"";position:absolute;inset:0;
  background:linear-gradient(180deg,rgba(18,20,22,0) 30%,var(--background) 100%)}
.hero .art::before{content:"";position:absolute;inset:0;opacity:.35;
  background-image:linear-gradient(rgba(255,255,255,.05) 1px,transparent 1px);background-size:100% 4px}
.hero .inner{position:relative;z-index:1;max-width:60rem}
.hero h1{margin:.35rem 0 .3rem;font-size:2.4rem;line-height:1.1;color:#f0e6d6;
  text-shadow:0 2px 14px rgba(0,0,0,.85)}
.hero p{margin:0;color:var(--foreground-alt);font-size:14.5px;text-shadow:0 1px 6px rgba(0,0,0,.8)}
.badges{display:flex;flex-wrap:wrap;gap:.4rem;margin-top:.9rem}
.badge{padding:.2rem .55rem;border-radius:.3rem;font-size:10.5px;font-weight:700;letter-spacing:.09em;
  text-transform:uppercase;background:rgba(0,0,0,.45);border:1px solid rgba(255,255,255,.14);
  color:var(--foreground-alt)}
.badge.gold{border-color:rgba(201,170,113,.5);color:var(--primary)}
.badge.hot{border-color:rgba(245,128,43,.55);color:var(--launcher-accent-foreground)}

.wrap{max-width:76rem;margin:0 auto;padding:1.6rem 2rem 2.5rem}
.grid{display:grid;gap:1rem}
.cols{grid-template-columns:repeat(auto-fill,minmax(15rem,1fr))}
.card{background:var(--secondary);border:1px solid rgba(255,255,255,.07);border-radius:var(--radius);
  padding:1rem 1.1rem}
.card h3{margin:0 0 .7rem;font-size:12px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;
  color:var(--foreground-dim)}
.stat{display:flex;align-items:center;justify-content:space-between;gap:.75rem;padding:.42rem 0;
  border-bottom:1px solid rgba(255,255,255,.05);font-size:13.5px}
.stat:last-child{border-bottom:0}
.stat .k{color:var(--foreground-dim)}
.stat .v{font-variant-numeric:tabular-nums;font-weight:600;display:flex;align-items:center;gap:.45rem}
.sectionhead{display:flex;align-items:baseline;justify-content:space-between;gap:1rem;
  margin:1.9rem 0 .8rem;padding-bottom:.6rem;border-bottom:1px solid var(--secondary-alt)}
.sectionhead h2{margin:0;font-size:1.2rem;color:#e6dcc9}

/* ------------------------------------------------------------- addons */
.toolbar{display:flex;flex-wrap:wrap;gap:.6rem;align-items:center;margin-bottom:1rem}
.search{flex:1;min-width:12rem;display:flex;align-items:center;gap:.5rem;background:var(--secondary);
  border:1px solid rgba(255,255,255,.1);border-radius:.45rem;padding:.5rem .7rem}
.search:focus-within{border-color:var(--primary)}
.search input{flex:1;min-width:0;background:none;border:0;outline:0}
.search svg{width:1rem;height:1rem;fill:var(--foreground-dim)}
.chip{appearance:none;background:var(--secondary);border:1px solid rgba(255,255,255,.1);
  border-radius:999px;padding:.4rem .85rem;font-size:11.5px;font-weight:700;letter-spacing:.07em;
  text-transform:uppercase;color:var(--foreground-alt);cursor:pointer;transition:.15s}
.chip:hover{border-color:var(--secondary-light)}
.chip[aria-pressed="true"]{background:rgba(201,170,113,.15);border-color:var(--primary);color:var(--primary)}
.catgroup{margin-bottom:1.4rem}
.catbar{display:flex;align-items:center;gap:.6rem;margin:0 0 .5rem;padding-bottom:.4rem;
  border-bottom:1px solid var(--secondary-alt)}
.catbar h3{margin:0;font-size:12px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;
  color:var(--primary)}
.catbar .n{font-size:11px;color:var(--foreground-dim);font-variant-numeric:tabular-nums}
.addon{display:flex;align-items:center;gap:.9rem;padding:.6rem .8rem;border-radius:.5rem;
  border:1px solid transparent;transition:.15s}
.addon:hover{background:var(--secondary);border-color:rgba(255,255,255,.07)}
.addon .icon{width:2.1rem;height:2.1rem;flex:0 0 auto;border-radius:.4rem;display:grid;place-items:center;
  background:var(--secondary-alt);color:var(--foreground-dim);font-weight:700;font-size:.85rem}
.addon.ins .icon{background:linear-gradient(145deg,var(--primary),var(--primary-alt));color:#14100c}
.addon.dis .icon{background:var(--secondary-alt);color:var(--warn)}
.addon .meta{flex:1;min-width:0}
.addon .nm{font-size:14px;font-weight:600;display:flex;align-items:center;gap:.45rem}
.addon .ds{font-size:12.5px;color:var(--foreground-dim);overflow:hidden;text-overflow:ellipsis;
  white-space:nowrap}
.addon .acts{display:flex;align-items:center;gap:.5rem;flex:0 0 auto}
.tag{font-size:9.5px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;padding:.1rem .35rem;
  border-radius:.25rem;border:1px solid rgba(255,255,255,.16);color:var(--foreground-dim)}
.tag.rec{border-color:rgba(201,170,113,.5);color:var(--primary)}
.tag.warn{border-color:rgba(244,176,55,.5);color:var(--warn)}
.sw{appearance:none;width:2.5rem;height:1.35rem;border-radius:999px;background:var(--secondary-alt2);
  border:1px solid rgba(255,255,255,.1);position:relative;cursor:pointer;transition:.18s;flex:0 0 auto}
.sw::after{content:"";position:absolute;top:50%;left:.18rem;transform:translateY(-50%);
  width:.95rem;height:.95rem;border-radius:50%;background:var(--foreground-dim);transition:.18s}
.sw[aria-checked="true"]{background:rgba(201,170,113,.35);border-color:var(--primary)}
.sw[aria-checked="true"]::after{left:1.35rem;background:var(--primary)}
.sw:disabled{opacity:.4;cursor:not-allowed}
.mini{appearance:none;background:var(--secondary-alt);border:1px solid rgba(255,255,255,.12);
  border-radius:.35rem;padding:.3rem .65rem;font-size:11px;font-weight:700;letter-spacing:.07em;
  text-transform:uppercase;color:var(--foreground-alt);cursor:pointer;transition:.15s}
.mini:hover{border-color:var(--primary);color:var(--primary)}
.mini.danger:hover{border-color:var(--bad);color:var(--bad)}
.mini:disabled{opacity:.4;cursor:not-allowed}

/* ---------------------------------------------------------- changelog */
/* Their layout: aside w-72 nav + flex-1 column of sections, entries divided
   by border-b-2 border-neutral-800. */
.clog{display:grid;grid-template-columns:17rem 1fr;gap:2rem;align-items:start}
.clognav{position:sticky;top:1rem;display:flex;flex-direction:column;gap:.15rem}
.clognav a{padding:.4rem .6rem;border-radius:.35rem;border-left:2px solid transparent;font-size:13px;
  color:var(--foreground-dim);display:flex;gap:.55rem;align-items:baseline}
.clognav a:hover{background:var(--secondary);color:var(--foreground)}
.clognav a.on{border-left-color:var(--primary);color:var(--primary);background:var(--secondary)}
.clognav .d{font-size:10.5px;font-variant-numeric:tabular-nums;color:var(--secondary-lighter)}
.entry{padding:1.2rem 0;border-bottom:2px solid var(--secondary-alt0)}
.entry:first-child{padding-top:0}
.entry h3{margin:.35rem 0 .5rem;font-size:1.35rem;color:#e6dcc9;font-family:Cinzel,serif}
.entry .m{display:flex;flex-wrap:wrap;gap:.45rem;align-items:center}
.entry .sum{color:var(--foreground-alt);margin:.1rem 0 .6rem}
.entry ul{margin:.4rem 0 0;padding-left:1.1rem;color:var(--foreground-alt)}
.entry li{margin:.3rem 0}
.entry .ev{margin-top:.7rem;font-size:11.5px;color:var(--secondary-lighter);
  font-family:ui-monospace,"Cascadia Mono",Consolas,monospace;word-break:break-all}
.kind{padding:.15rem .45rem;border-radius:.25rem;font-size:9.5px;font-weight:700;letter-spacing:.1em;
  text-transform:uppercase;border:1px solid rgba(255,255,255,.16);color:var(--foreground-dim)}
.kind.server{border-color:rgba(245,128,43,.5);color:var(--launcher-accent-foreground)}
.kind.config{border-color:rgba(63,208,201,.45);color:#5fd6d0}
.kind.content{border-color:rgba(201,170,113,.5);color:var(--primary)}
.kind.client{border-color:rgba(160,120,220,.5);color:#b48bea}
.kind.tooling{border-color:rgba(130,170,140,.5);color:#8fbf9c}

/* ------------------------------------------------------------- footer */
.foot{display:flex;align-items:center;gap:1.25rem;padding:.85rem 1.5rem;background:var(--secondary);
  border-top:1px solid var(--hairline);z-index:5}
.footinfo{min-width:0;flex:1}
.footinfo .t{font-family:Cinzel,serif;font-weight:700;font-size:.95rem;color:#e6dcc9;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.footinfo .s{font-size:11.5px;color:var(--foreground-dim);display:flex;gap:.9rem;flex-wrap:wrap;
  margin-top:.15rem}
.footinfo .s span{display:flex;align-items:center;gap:.35rem}

/* CTA button, dimensions straight from their --cta-button-* tokens */
.ctawrap{display:flex;align-items:center;gap:.5rem;flex:0 0 auto}
.cta{position:relative;height:var(--cta-button-height);min-width:13rem;
  border-radius:var(--cta-button-radius);border:0;cursor:pointer;overflow:hidden;
  padding:.375rem 1.5rem .375rem .375rem;display:flex;align-items:center;gap:.85rem;
  background:linear-gradient(180deg,var(--cta-1) 0%,var(--cta-3) 100%);
  box-shadow:inset 0 1px 0 rgba(255,220,150,.25),0 6px 20px rgba(0,0,0,.55);
  transition:filter .18s,transform .06s}
.cta:hover{filter:brightness(1.12)}
.cta:active{transform:translateY(1px)}
.cta:disabled{cursor:not-allowed;filter:grayscale(.85) brightness(.6)}
.cta .ind{width:var(--cta-indicator);height:var(--cta-indicator);border-radius:50%;flex:0 0 auto;
  background:rgba(0,0,0,.28);display:grid;place-items:center;
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.14)}
.cta .ind svg{width:1.6rem;height:1.6rem;fill:#fff2dd}
.cta .lbl{display:flex;flex-direction:column;align-items:flex-start;gap:.1rem;min-width:0}
.cta .lbl b{font-family:Cinzel,serif;font-size:1.02rem;letter-spacing:.09em;text-transform:uppercase;
  color:#fff4e4;text-shadow:0 1px 4px rgba(0,0,0,.6);white-space:nowrap}
.cta .lbl i{font-style:normal;font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;
  color:rgba(255,255,255,.72);white-space:nowrap}
.cta .fill{position:absolute;left:0;bottom:0;height:3px;width:0;background:var(--launcher-accent-foreground-secondary);
  transition:width .35s ease}
.cta.busy{background:linear-gradient(180deg,var(--secondary-alt2) 0%,var(--secondary-alt) 100%)}
.cta.busy .lbl b{color:#e8dcc6}
.stack{display:flex;flex-direction:column;gap:.3rem}

/* --------------------------------------------------------------- misc */
.log{background:var(--filling-alt2);border:1px solid rgba(255,255,255,.08);border-radius:.45rem;
  padding:.7rem .85rem;font-family:ui-monospace,"Cascadia Mono",Consolas,monospace;font-size:12px;
  color:#a8b3ad;max-height:16rem;overflow:auto;white-space:pre-wrap;margin-top:.8rem}
.empty{padding:2.5rem 1rem;text-align:center;color:var(--foreground-dim)}
#toast{position:fixed;left:50%;bottom:6.5rem;transform:translate(-50%,1rem);opacity:0;pointer-events:none;
  background:var(--launcher-theme-dialog);border:1px solid rgba(255,255,255,.16);border-radius:.5rem;
  padding:.65rem 1.1rem;font-size:13px;max-width:36rem;z-index:40;transition:.2s;
  box-shadow:0 10px 30px rgba(0,0,0,.6)}
#toast.on{opacity:1;transform:translate(-50%,0)}
#toast.bad{border-color:rgba(224,85,85,.6)}

/* splash - same beat as their splash.html: pulse logo, orbiting spark, fade out */
#splash{position:fixed;inset:0;z-index:100;display:grid;place-items:center;
  background:radial-gradient(120% 120% at 50% 20%,var(--launcher-theme) 0%,var(--filling-alt2) 70%);
  transition:opacity .45s}
#splash.gone{opacity:0;pointer-events:none}
.splash-in{display:flex;flex-direction:column;align-items:center;gap:1.6rem}
.splash-mark{font-family:Cinzel,serif;font-weight:700;font-size:2rem;letter-spacing:.24em;
  text-transform:uppercase;color:var(--primary);animation:pulse 2s ease-in-out infinite;
  text-shadow:0 0 18px rgba(0,0,0,.9),0 0 40px rgba(201,170,113,.25)}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.65}}
.spin-wrap{position:relative;width:44px;height:44px}
.spin{width:44px;height:44px;border:2px solid rgba(201,170,113,.12);border-top-color:var(--primary);
  border-right-color:rgba(201,170,113,.35);border-radius:50%;animation:spin 1.2s ease-in-out infinite;
  box-shadow:0 0 10px rgba(201,170,113,.3),inset 0 0 8px rgba(201,170,113,.1)}
.spark{position:absolute;width:3px;height:3px;background:#f0d890;border-radius:50%;
  box-shadow:0 0 4px 1px rgba(244,176,55,.8);animation:orbit 1.2s ease-in-out infinite}
.spark:nth-child(3){animation-delay:-.4s}
.spark:nth-child(4){animation-delay:-.8s;opacity:.7}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes orbit{
  0%{top:0;left:50%;opacity:1;transform:scale(1)}
  25%{top:50%;left:100%;opacity:.6;transform:scale(.7)}
  50%{top:100%;left:50%;opacity:.3;transform:scale(.4)}
  75%{top:50%;left:0;opacity:.1;transform:scale(.3)}
  100%{top:0;left:50%;opacity:1;transform:scale(1)}}
.splash-status{font-size:12.5px;letter-spacing:.06em;color:var(--foreground-alt);min-height:1.2rem}

@media (max-width:900px){
  .body{grid-template-columns:1fr}
  .rail{display:none}
  .clog{grid-template-columns:1fr}
  .clognav{position:static}
  .navtab i{display:none}
}

.knob .kr>.mini{flex:0 0 auto;margin-left:auto}

  background:var(--secondary-alt2);outline:0}

.rowbtns{display:flex;flex-wrap:wrap;gap:.5rem;margin-top:.8rem}

  font-family:ui-monospace,"Cascadia Mono",Consolas,monospace;font-size:12.5px;color:#d8c9a4}

/* trainer / bots command cards */
.cmdgrid{display:grid;gap:.8rem;grid-template-columns:repeat(auto-fill,minmax(19rem,1fr))}
.cmdcard{background:var(--secondary);border:1px solid rgba(255,255,255,.07);border-radius:var(--radius);

  padding:.7rem .85rem}
.refcmd .h{display:flex;align-items:center;justify-content:space-between;gap:.6rem}

.sec{font-size:9.5px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;padding:.1rem .35rem;

:root{--q0:#9d9d9d;--q1:#e8e8e8;--q2:#1eff00;--q3:#0070dd;--q4:#a335ee;--q5:#ff8000;
  --q6:#e6cc80;--q7:#00ccff}
.q0{color:var(--q0)}.q1{color:var(--q1)}.q2{color:var(--q2)}.q3{color:var(--q3)}
.q4{color:var(--q4)}.q5{color:var(--q5)}.q6{color:var(--q6)}.q7{color:var(--q7)}

function renderRail(){
  var realms = $('realmlist'), clients = $('clientlist');
  realms.innerHTML = ''; clients.innerHTML = '';
  var nr = 0;

  function card(p, nested){
    var b = el('button','realm' + (p.installed ? '' : ' dim') + (nested ? ' nested' : ''));
    b.type = 'button';
    b.setAttribute('aria-current', p.slug === S.sel ? 'true' : 'false');
    var crest = el('div','crest', (p.name || p.slug).charAt(0).toUpperCase());
    crest.style.setProperty('--a', p.accent || '#c9aa71');
    b.appendChild(crest);
    var t = el('div','rt');
    t.appendChild(el('div','rn', p.name));
    var sub = p.installed ? (p.serverUp ? 'running' : (p.active ? 'active' : 'installed'))
                          : (p.status === 'planned' ? 'not installed' : p.status);
    t.appendChild(el('div','rs', sub));
    b.appendChild(t);
    if (p.serverUp) { var d = el('span','dot on'); b.appendChild(d); }
    // The rail is narrow and .rn ellipsises; two profiles can share a prefix
    // ('Conquest of Azeroth' / 'Conquest of Azeroth (stock client)'), so the full
    // name has to be reachable somewhere.
    b.title = p.name + (p.tagline ? '  —  ' + p.tagline : '');
    b.onclick = function(){ select(p.slug); };
    return b;
  }

  // A child whose parent is missing from the list is drawn at the top level, so a
  // typo in `nestedUnder` cannot make a profile disappear from the launcher.
  var have = {}, kids = {};
  S.products.forEach(function(p){ have[p.slug] = true; });
  S.products.forEach(function(p){
    if (p.nestedUnder && have[p.nestedUnder]) {
      (kids[p.nestedUnder] = kids[p.nestedUnder] || []).push(p);
    }
  });

  S.products.forEach(function(p){
    if (p.nestedUnder && have[p.nestedUnder]) return;   // drawn under its parent
    var group = p.kind === 'client' ? clients : realms;
    group.appendChild(card(p, false));
    if (p.kind !== 'client') nr++;
    (kids[p.slug] || []).forEach(function(c){
      (c.kind === 'client' ? clients : group).appendChild(card(c, true));
      if (c.kind !== 'client') nr++;
    });
  });
  $('realmcount').textContent = nr;
}

function select(slug){
  if (S.sel === slug) return;
  S.sel = slug;
  S.query = ''; S.filter = 'all';
  refInvalidate();
  renderRail();
  loadForSelection();
  render();
}

/* --------------------------------------------------------------- hero */
function heroFor(p){
  var h = el('div','hero');
  h.style.setProperty('--a', p.accent || '#c9aa71');
  h.appendChild(el('div','art'));
  var inner = el('div','inner');
  var eyebrow = p.kind === 'client' ? 'Alternate client' : 'Realm';
  if (p.nestedUnder) {
    var par = S.products.filter(function(q){ return q.slug === p.nestedUnder; })[0];
    if (par) eyebrow += '  ·  a mode of ' + par.name;
  }
  inner.appendChild(el('div','eyebrow', eyebrow));
  inner.appendChild(el('h1','display', p.name));
  inner.appendChild(el('p', null, p.tagline || ''));
  var badges = el('div','badges');
  function badge(txt, cls){ badges.appendChild(el('span','badge' + (cls ? ' ' + cls : ''), txt)); }
  var b = p.builder || {};
  badge('Max level ' + (b.max_level || '?'), 'gold');
  if (b.draft) badge('Draft', 'hot');
  if (b.architect) badge('Architect', 'hot');
  if (b.coa) badge('Conquest of Azeroth', 'hot');
  if (!b.draft && !b.architect && !b.coa) badge('Classic talents');
  if (p.sharesRealm) badge('Uses the ' + p.sharesRealm + ' realm');
  badge(p.installed ? 'Installed' : 'Not installed', p.installed ? '' : 'hot');
  inner.appendChild(badges);
  h.appendChild(inner);
  return h;
}

/* --------------------------------------------------------------- play */
function renderPlay(){
  var v = $('view-play'), p = cur();
  v.innerHTML = '';
  if (!p) { v.appendChild(el('div','empty','No realms configured.')); return; }
  v.appendChild(heroFor(p));

  var w = el('div','wrap');
  var g = el('div','grid cols');

  var c1 = el('div','card');
  c1.appendChild(el('h3', null, 'Realm status'));
  var st = S.settings[p.slug] || {};
  function row(k, val, dotcls){
    var r = el('div','stat');
    r.appendChild(el('span','k', k));
    var vv = el('span','v');
    if (dotcls) vv.appendChild(el('span','dot ' + dotcls));
    vv.appendChild(el('span', null, val));
    r.appendChild(vv);
    c1.appendChild(r);
  }
  var hub = S.hub || {};
  row('World server', p.serverUp ? (p.ready ? 'ready' : 'starting') : 'stopped',
      p.serverUp ? (p.ready ? 'on' : 'warn') : 'off');
  if (hub.usesAuthserver === false){
    /* No authserver.exe by design - show the helpers that DO serve auth. */
    (hub.helpers || []).forEach(function(h){
      row(h.label || h.name, h.up ? ('up \u00b7 :' + h.port) : 'down',
          h.up ? 'on' : 'off');
    });
  } else {
    row('Auth server', (hub.authserver && hub.authserver.up) ? 'up' : 'down',
        (hub.authserver && hub.authserver.up) ? 'on' : 'off');
  }
  row('Active realm', hub.activeRealm || '-', p.active ? 'on' : '');
  if (st.phase) row('Progression phase', st.phase);
  c1.appendChild(el('div','stat'));
  g.appendChild(c1);

  var c2 = el('div','card');
  c2.appendChild(el('h3', null, 'This build'));
  var s = st.settings || {};
  /* Only the rows this realm actually has a config for.  product_settings()
     omits a key whose file is absent, and printing "?" for it reads as a broken
     realm rather than one that simply does not run bots or an LLM. */
  var rows = [];
  if (s.MinRandomBots !== undefined || s.MaxRandomBots !== undefined)
    rows.push(['Bots (min/max)', (s.MinRandomBots||'?') + ' / ' + (s.MaxRandomBots||'?')]);
  if (s.RandomBotMaxLevel !== undefined) rows.push(['Bot level cap', s.RandomBotMaxLevel]);
  if (s.PlayerSaveInterval !== undefined)
    rows.push(['Save interval', Math.round(s.PlayerSaveInterval/60000) + ' min']);
  if (s.OllamaModel !== undefined) rows.push(['Chat model', s.OllamaModel]);
  if (rows.length){
    rows.forEach(function(pair){
      var r = el('div','stat');
      r.appendChild(el('span','k', pair[0]));
      r.appendChild(el('span','v', String(pair[1])));
      c2.appendChild(r);
    });
  } else {
    c2.appendChild(el('div','empty','No live configs for this profile yet.'));
  }
  g.appendChild(c2);

  var c3 = el('div','card');
  c3.appendChild(el('h3', null, 'Addons'));
  var m = S.modules;
  if (m && m.slug === p.slug && m.actionable){
    var r1 = el('div','stat');
    r1.appendChild(el('span','k','Installed'));
    r1.appendChild(el('span','v', m.installed + ' of ' + m.count));
    c3.appendChild(r1);
    var r2 = el('div','stat');
    r2.appendChild(el('span','k','Hand-added folders'));
    r2.appendChild(el('span','v', String((m.foreign||[]).length)));
    c3.appendChild(r2);
    var go = el('button','mini','Manage addons');
    go.style.marginTop = '.7rem';
    go.onclick = function(){ setView('addons'); };
    c3.appendChild(go);
  } else {
    c3.appendChild(el('div','empty','Addon management is not wired for this profile.'));
  }
  g.appendChild(c3);
  w.appendChild(g);

  if (!p.installed){
    var note = el('div','card');
    note.style.marginTop = '1rem';
    note.appendChild(el('h3', null, 'Not installed yet'));
    note.appendChild(el('p', null, p.notes || ''));
    if ((p.requires||[]).length){
      var ul = el('ul');
      p.requires.forEach(function(x){ ul.appendChild(el('li', null, x)); });
      note.appendChild(ul);
    }
    w.appendChild(note);
  }

  var cl = S.changelog[p.slug];
  if (cl && cl.entries && cl.entries.length){
    var head = el('div','sectionhead');
    head.appendChild(el('h2','display','Latest changes'));
    var all = el('button','mini','View all');
    all.onclick = function(){ setView('changelog'); };
    head.appendChild(all);
    w.appendChild(head);
    cl.entries.slice(0,3).forEach(function(e){ w.appendChild(entryNode(e, true)); });
  }

  if (S.job && S.job.log && S.job.log.length){
    var lh = el('div','sectionhead');
    lh.appendChild(el('h2','display','Last action'));
    w.appendChild(lh);
    w.appendChild(logLines(S.job.log));
  }
  v.appendChild(w);
}

/* ------------------------------------------------------------- addons */
function renderAddons(){
  var v = $('view-addons'), p = cur();
  v.innerHTML = '';
  if (!p) return;
  var w = el('div','wrap');
  var head = el('div','sectionhead');
  head.appendChild(el('h2','display','Addons'));
  w.appendChild(head);

  var m = S.modules;
  if (!m || m.slug !== p.slug){
    w.appendChild(el('div','empty','Loading addon catalog…'));
    v.appendChild(w); return;
  }
  if (m.error){ w.appendChild(el('div','empty', m.error)); v.appendChild(w); return; }

  var bar = el('div','toolbar');
  var sb = el('div','search');
  sb.appendChild(svg(ICON.search));
  var inp = document.createElement('input');
  inp.type = 'search'; inp.placeholder = 'Search ' + m.count + ' addons…';
  inp.value = S.query; inp.autocomplete = 'off';
  inp.oninput = function(){ S.query = inp.value; paintGroups(); };
  sb.appendChild(inp);
  bar.appendChild(sb);
  [['all','All'],['installed','Installed'],['disabled','Disabled'],['recommended','Recommended']]
    .forEach(function(f){
      var c = el('button','chip', f[1]);
      c.type = 'button';
      c.setAttribute('aria-pressed', S.filter === f[0] ? 'true' : 'false');
      c.onclick = function(){ S.filter = f[0]; renderAddons(); };
      bar.appendChild(c);
    });
  w.appendChild(bar);

  if (!m.actionable){
    var warn = el('div','card');
    warn.style.marginBottom = '1rem';
    warn.appendChild(el('p', null,
      'Browsing only: installs are wired to the vanilla client (' + (m.addonsDir||'?') + ').'));
    w.appendChild(warn);
  }

  var groups = el('div');
  groups.id = 'addongroups';
  w.appendChild(groups);
  v.appendChild(w);
  paintGroups();
}

function matchAddon(a){
  if (S.filter === 'installed' && !a.installed) return false;
  if (S.filter === 'disabled' && !a.disabled) return false;
  if (S.filter === 'recommended' && !a.recommended) return false;
  if (!S.query) return true;
  var q = S.query.toLowerCase();
  return (a.name||'').toLowerCase().indexOf(q) >= 0 ||
         (a.desc||'').toLowerCase().indexOf(q) >= 0;
}

function paintGroups(){
  var host = $('addongroups');
  if (!host) return;
  var m = S.modules;
  host.innerHTML = '';
  var shown = 0;
  (m.categories||[]).forEach(function(cat){
    var list = cat.addons.filter(matchAddon);
    if (!list.length) return;
    shown += list.length;
    var g = el('div','catgroup');
    var cb = el('div','catbar');
    cb.appendChild(el('h3', null, cat.name));
    cb.appendChild(el('span','n', list.length + (list.length === cat.addons.length ? '' :
      ' of ' + cat.addons.length)));
    g.appendChild(cb);
    list.forEach(function(a){ g.appendChild(addonRow(a, m.actionable)); });
    host.appendChild(g);
  });
  if (!shown) host.appendChild(el('div','empty','Nothing matches that filter.'));
}

function addonRow(a, actionable){
  var row = el('div','addon' + (a.installed ? ' ins' : '') + (a.disabled ? ' dis' : ''));
  var ic = el('div','icon');
  if (a.installed && !a.disabled) ic.appendChild(svg(ICON.check));
  else ic.textContent = (a.name||'?').charAt(0).toUpperCase();
  row.appendChild(ic);

  var meta = el('div','meta');
  var nm = el('div','nm');
  nm.appendChild(el('span', null, a.name));
  if (a.recommended) nm.appendChild(el('span','tag rec','Rec'));
  if (a.disabled) nm.appendChild(el('span','tag warn','Disabled'));
  if (a.interface && a.interface !== '30300')
    nm.appendChild(el('span','tag warn','iface ' + a.interface));
  meta.appendChild(nm);
  meta.appendChild(el('div','ds', (a.desc||'') + (a.size ? '  ·  ' + bytes(a.size) : '')));
  row.appendChild(meta);

  var acts = el('div','acts');
  // Address the profile these rows were built for.  Omitting it let the backend
  // fall back to profiles.json's activeRealm, so toggling an addon while viewing
  // vanilla was aimed at whichever realm happened to be live.
  var mslug = (S.modules && S.modules.slug) || S.sel;
  if (a.installed){
    // Toggle = /v1/modules/replace: sideline or restore the folder, never delete.
    var sw = el('button','sw');
    sw.type = 'button';
    sw.setAttribute('role','switch');
    sw.setAttribute('aria-checked', a.disabled ? 'false' : 'true');
    sw.setAttribute('aria-label', (a.disabled ? 'Enable ' : 'Disable ') + a.name);
    sw.disabled = !actionable;
    sw.onclick = function(){
      sw.disabled = true;
      api('/v1/modules/replace', {name:a.name, enabled:!!a.disabled, slug:mslug}).then(function(r){
        toast((r.log||[]).join(' · '), !r.ok);
        return refreshModules();
      });
    };
    acts.appendChild(sw);
    var rm = el('button','mini danger','Remove');
    rm.disabled = !actionable;
    rm.onclick = function(){
      rm.disabled = true; rm.textContent = 'Removing…';
      api('/v1/modules/remove', {name:a.name, slug:mslug}).then(function(r){
        toast((r.log||[]).join(' · '), !r.ok);
        return refreshModules();
      });
    };
    acts.appendChild(rm);
  } else {
    var ins = el('button','mini','Install');
    ins.disabled = !actionable;
    ins.onclick = function(){
      ins.disabled = true; ins.textContent = 'Installing…';
      api('/v1/modules/add', {name:a.name, slug:mslug}).then(function(r){
        toast((r.log||[]).join(' · '), !r.ok);
        return refreshModules();
      });
    };
    acts.appendChild(ins);
  }
  row.appendChild(acts);
  return row;
}

function refreshModules(){
  var p = cur();
  if (!p) return Promise.resolve();
  return api('/v1/modules?slug=' + encodeURIComponent(p.slug)).then(function(m){
    S.modules = m;
    if (S.view === 'addons') paintGroups(); else render();
  });
}

/* ---------------------------------------------------------- changelog */
function entryNode(e, compact){
  var n = el('div','entry');
  var m = el('div','m');
  m.appendChild(el('span','kind ' + (e.kind||''), e.kind || 'change'));
  m.appendChild(el('span','eyebrow', e.date || ''));
  if (e.needsBackfill) m.appendChild(el('span','tag warn','needs backfill'));
  (e.tags||[]).forEach(function(t){ m.appendChild(el('span','tag', t)); });
  n.appendChild(m);
  var h = el('h3');
  h.id = 'cl-' + (e.id || '');
  h.textContent = e.title || '(untitled)';
  n.appendChild(h);
  if (e.summary) n.appendChild(el('div','sum', e.summary));
  if (!compact && (e.body||[]).length){
    var ul = el('ul');
    e.body.forEach(function(b){ ul.appendChild(el('li', null, b)); });
    n.appendChild(ul);
  }
  if (!compact && (e.evidence||[]).length){
    n.appendChild(el('div','ev', 'evidence: ' + e.evidence.join('  ·  ')));
  }
  return n;
}

function renderChangelog(){
  var v = $('view-changelog'), p = cur();
  v.innerHTML = '';
  if (!p) return;
  var w = el('div','wrap');
  var head = el('div','sectionhead');
  head.appendChild(el('h2','display', p.name + ' — changelog'));
  w.appendChild(head);

  var cl = S.changelog[p.slug];
  if (!cl){ w.appendChild(el('div','empty','Loading…')); v.appendChild(w); return; }
  if (cl.note){
    var note = el('div','card');
    note.style.marginBottom = '1.2rem';
    note.appendChild(el('h3', null, 'About this log'));
    note.appendChild(el('p', null, cl.note));
    w.appendChild(note);
  }
  if (!(cl.entries||[]).length){
    w.appendChild(el('div','empty','No entries yet. Drop them into realms/changelog/' + p.slug + '.json.'));
    v.appendChild(w); return;
  }

  var grid = el('div','clog');
  var nav = el('nav','clognav');
  var col = el('div');
  cl.entries.forEach(function(e, i){
    var a = el('a', i === 0 ? 'on' : '');
    a.href = '#cl-' + (e.id || i);
    a.appendChild(el('span','d', (e.date||'').slice(5)));
    a.appendChild(el('span', null, e.title || ''));
    a.onclick = function(){
      nav.querySelectorAll('a').forEach(function(x){ x.classList.remove('on'); });
      a.classList.add('on');
    };
    nav.appendChild(a);
    col.appendChild(entryNode(e, false));
  });
  grid.appendChild(nav);
  grid.appendChild(col);
  w.appendChild(grid);
  v.appendChild(w);
}

    .style.fontSize = '12px';

  w.appendChild(g);

  if (p.notes){

    n.style.marginTop = '1rem';

    n.appendChild(el('p', null, p.notes));

/* ---------------------------------------------------------------- CTA */
function ctaState(){
  var p = cur();
  if (!p) return {label:'No realm', sub:'nothing selected', icon:ICON.power, disabled:true};
  if (S.job && S.job.state === 'running')
    return {label: S.job.action === 'stop' ? 'Stopping'
                 : S.job.action === 'switch' ? 'Switching' : 'Starting',
            sub: S.job.step || '', icon:ICON.power, disabled:true, busy:true,
            pct: S.job.pct || 0};
  if (!p.installed)
    return {label:'Unavailable', sub:'not installed', icon:ICON.power, disabled:true};
  if (p.kind === 'client')
    return {label:'Play', sub: p.serverUp ? 'realm is up' : 'start a realm first',
            icon:ICON.play, disabled:false, act:'launch'};
  /* An independent profile holds its own ports and runs BESIDE the active realm,
     so it is started and stopped on its own and never switched to. */
  if (p.independent){
    if (!p.serverUp)
      return {label:'Start realm', sub:'runs beside ' + activeName(), icon:ICON.power,
              disabled:false, act:'start'};
    if (!p.ready)
      return {label:'Loading world', sub:'maps still loading', icon:ICON.power,
              disabled:true, busy:true, pct:80};
    return {label:playLabel(p), sub:'realm is ready', icon:ICON.play,
            disabled:false, act:'launch'};
  }
  if (!p.active){
    var h = S.hub || {}, busyRealm = !!(h.worldserver && h.worldserver.up);
    var from = (S.byslug[h.activeRealm] || {}).name || h.activeRealm || 'the running realm';
    return {label: busyRealm ? 'Switch to this realm' : 'Start realm',
            sub: busyRealm ? 'stops ' + from + ' first - characters are saved'
                           : 'makes this the active realm',
            icon:ICON.power, disabled:false, act:'switch'};
  }
  if (!p.serverUp)
    return {label:'Start realm', sub:'mysql, auth, world', icon:ICON.power,
            disabled:false, act:'start'};
  if (!p.ready)
    return {label:'Loading world', sub:'maps still loading', icon:ICON.power,
            disabled:true, busy:true, pct:80};
  return {label:playLabel(p), sub:'realm is ready', icon:ICON.play,
          disabled:false, act:'launch'};
}

function activeName(){
  var h = S.hub || {};
  return (S.byslug[h.activeRealm] || {}).name || h.activeRealm || 'the active realm';
}

/* With one client the button just says Play.  With two it has to say WHICH, or
   the pair reads as "Play" and "the other one". */
function playLabel(p){
  var L = p.launchers || [];
  return (L.length > 1 && L[0].label) ? L[0].label : 'Play';
}

function renderCTA(){
  var p = cur(), s = ctaState();
  $('footname').textContent = p ? p.name : '—';
  var fs = $('footstate');
  fs.innerHTML = '';
  if (p){
    var hub = S.hub || {};
    [['World', p.serverUp ? (p.ready ? 'ready' : 'loading') : 'stopped',
      p.serverUp ? (p.ready ? 'on' : 'warn') : 'off'],
     authChip(hub),
     ['Active', hub.activeRealm || '—', p.active ? 'on' : '']
    ].forEach(function(t){
      var sp = el('span');
      sp.appendChild(el('span','dot ' + t[2]));
      sp.appendChild(el('span', null, t[0] + ': ' + t[1]));
      fs.appendChild(sp);
    });
  }

  var btn = $('cta');
  btn.disabled = !!s.disabled;
  btn.classList.toggle('busy', !!s.busy);
  $('ctalabel').textContent = s.label;
  $('ctasub').textContent = s.sub;
  $('ctaicon').innerHTML = '';
  $('ctaicon').appendChild(svg(s.icon));
  $('ctafill').style.width = (s.busy ? (s.pct || 0) : 0) + '%';
  btn.onclick = function(){ doAction(s.act); };

  var extra = $('ctaextra');
  extra.innerHTML = '';
  var jobbusy = !!(S.job && S.job.state === 'running');
  /* A realm played by more than one client gets a button per extra client beside
     the main Play - the CoA fork is played by Ascension.exe AND by the stock
     3.3.5a client, and that is a choice, not a setting. */
  if (p && s.act === 'launch' && !jobbusy){
    (p.launchers || []).slice(1).forEach(function(L){
      var b = el('button','mini', L.label);
      b.disabled = !L.exists;
      b.title = L.exists ? (L.note || '') : 'not installed';
      b.onclick = function(){ doAction('launch', L.id); };
      extra.appendChild(b);
    });
  }
  if (p && p.serverManaged && (p.active || p.independent) && p.serverUp && !jobbusy){
    var stop = el('button','mini danger','Stop');
    stop.onclick = function(){ doAction('stop'); };
    extra.appendChild(stop);
    var rs = el('button','mini','Restart');
    rs.onclick = function(){ doAction('restart'); };
    extra.appendChild(rs);
  }
}

function doAction(act, which){
  var p = cur();
  if (!p || !act) return;
  if (act === 'launch'){
    api('/v1/launch/' + p.slug, which ? {target:which} : {}).then(function(r){
      toast((r.log||[]).join(' · '), !r.ok);
    });
    return;
  }
  api('/v1/patch/' + p.slug, {action:act}).then(function(r){
    if (!r.ok){ toast((r.log||['failed']).join(' · '), true); return; }
    watchJob(p.slug, r.job);
  });
}

/* Live progress. SSE stands in for the daemon's websocket; a poll is kept as
   the fallback because EventSource gives up silently on some proxies. */
function watchJob(slug, jobId){
  if (S.es){ S.es.close(); S.es = null; }
  var url = '/v1/patch/' + slug + '/state/stream' + (jobId ? '?job=' + jobId : '');
  try {
    var es = new EventSource(url);
    S.es = es;
    es.onmessage = function(ev){
      try { S.job = JSON.parse(ev.data); } catch(e){ return; }
      renderCTA();
      renderCurrentView();
      if (S.job.state === 'done' || S.job.state === 'failed'){
        es.close(); S.es = null;
        toast(S.job.action + ' ' + S.job.state, S.job.state === 'failed');
        var pp = cur();
        if (pp) loadPanel(pp.slug).then(function(){ VSIG = {}; refresh(); });
        else refresh();
      }
    };
    es.onerror = function(){ es.close(); S.es = null; pollJob(slug, jobId); };
  } catch(e){ pollJob(slug, jobId); }
}
function pollJob(slug, jobId){
  var url = '/v1/patch/' + slug + '/state' + (jobId ? '?job=' + jobId : '');
  api(url).then(function(j){
    S.job = j;
    renderCTA();
    renderCurrentView();
    if (j.state === 'running') setTimeout(function(){ pollJob(slug, jobId); }, 900);
    else {
      var pp = cur();
      if (pp) loadPanel(pp.slug).then(function(){ VSIG = {}; refresh(); });
      else refresh();
    }
  });
}

/* --------------------------------------------------------------- load */
/* A view is only rebuilt when something it shows actually changed.  The 5s
   status poll calls render(), and a blind rebuild would wipe a half-typed rate
   or reset a slider mid-drag. */
/* A repaint replaces the whole pane, so it takes the caret with it.  These are
   the field types that have one worth keeping; a slider, a checkbox or a button
   holding focus is not a reason to hold anything back. */
var CARET_TYPES = { text:1, search:1, number:1, password:1, email:1, url:1,
                    tel:1, date:1, time:1, month:1, week:1 };
var RPEND = false;
function editing(){
  var a = document.activeElement;
  if (!a) return false;
  var t = (a.tagName || '').toLowerCase();
  if (t === 'textarea' || a.isContentEditable === true) return true;
  if (t !== 'input') return false;
  return CARET_TYPES[(a.type || 'text').toLowerCase()] === 1;
}
/* focusout fires before the next element takes focus, so let that settle: moving
   from one box straight to another should not repaint either of them. */
document.addEventListener('focusout', function(){
  setTimeout(function(){ if (RPEND && !editing()) renderCurrentView(); }, 0);
});

var VSIG = {};
function paint(id, fn, signature){
  if (VSIG[id] === signature && $('view-' + id).firstChild) return;
  VSIG[id] = signature;
  fn();
}
function sig(o){ try { return JSON.stringify(o); } catch(e){ return null; } }

function renderCurrentView(){
  // The 5s status poll and the job watcher both land here, and both would wipe a
  // half-typed box. Hold the repaint while a field has the caret; the focusout
  // handler above runs whatever was held.
  if (editing()){ RPEND = true; return; }
  RPEND = false;
  var p = cur(), j = S.job || {};
  if (S.view === 'play') renderPlay();
  else if (S.view === 'addons') renderAddons();
  else if (S.view === 'changelog') renderChangelog();
  else if (S.view === 'server')
    paint('server', renderServer, sig([PSTATE.overview, PSTATE.settings,
      PSTATE.log.length, j.state, j.step, p && p.serverUp, p && p.active]));
  else if (S.view === 'world')
    paint('world', renderWorld, sig([PSTATE.rates, PSTATE.busy]));
  else if (S.view === 'tools')
    paint('tools', renderTools, sig([PSTATE.trainer, PSTATE.bots, PSTATE.raid,
      PSTATE.modules, PSTATE.tool]));
  else if (S.view === 'items') renderItems();
  else if (S.view === 'reference')
    paint('reference', renderReference, sig([RF.cat, !!RF.data]));
  else renderSettings();
}

function render(){
  // A tab can stop applying when the selection changes (client profiles have no
  // Server tab), so fall back rather than leaving a blank pane on screen.
  if (!visibleViews().some(function(v){ return v.id === S.view; })){
    S.view = 'play';
    // setView() owns the .on class, so the fallback has to move it too - otherwise
    // the hidden tab's pane stays on screen under the newly selected profile.
    VIEWS.forEach(function(v){ $('view-' + v.id).classList.toggle('on', v.id === 'play'); });
    $('main').scrollTop = 0;
  }
  // The tab strip itself depends on the selection, so it is rebuilt here rather
  // than only on setView - otherwise picking a realm never reveals its tabs.
  renderNav();
  renderRail();
  renderCurrentView();
  renderCTA();
}

function loadForSelection(){
  var p = cur();
  if (!p) return Promise.resolve();
  var slug = p.slug;
  return Promise.all([
    api('/v1/products/' + slug).then(function(d){ S.detail = d; }),
    api('/v1/products/' + slug + '/settings').then(function(d){ S.settings[slug] = d || {}; }),
    api('/v1/products/' + slug + '/changelog').then(function(d){ S.changelog[slug] = d; }),
    api('/v1/modules?slug=' + encodeURIComponent(slug)).then(function(d){ S.modules = d; }),
    loadPanel(slug)
  ]).then(function(){ VSIG = {}; render(); });
}

function refresh(){
  return api('/v1/products').then(function(d){
    if (d._status && d._status >= 400) throw new Error('bad status');
    S.hub = d;
    S.products = d.products || [];
    S.byslug = {};
    S.products.forEach(function(p){ S.byslug[p.slug] = p; });
    if (!S.sel || !S.byslug[S.sel]) S.sel = d.activeRealm || (S.products[0]||{}).slug;
    $('hubdot').className = 'dot on';
    $('hubtext').textContent = 'hub online';
    render();
    return d;
  }).catch(function(){
    $('hubdot').className = 'dot off';
    $('hubtext').textContent = 'hub offline';
  });
}

function boot(){
  renderNav();
  $('splashstatus').textContent = 'Reading realm profiles…';
  refresh().then(function(){
    $('splashstatus').textContent = 'Loading catalog…';
    return Promise.all([
      loadForSelection(),
      api('/v1/available-disk-space').then(function(d){ S.disk = d; })
    ]);
  }).then(function(){
    // Resume a job that was already running when the page loaded.
    var p = cur();
    if (p) api('/v1/patch/' + p.slug + '/state').then(function(j){
      if (j && j.state === 'running'){ S.job = j; watchJob(p.slug, j.id); }
    });
    setTimeout(function(){ $('splash').classList.add('gone'); }, 260);
  }).catch(function(e){
    $('splashstatus').textContent = 'Could not reach the hub on this port.';
    setTimeout(function(){ $('splash').classList.add('gone'); }, 1600);
  });
  // Keep status honest without hammering: the panel is local, 5s is plenty.
  setInterval(function(){ if (!S.es) refresh(); }, 5000);
}


/* ==================================================================
   Ported control-panel views.

   Everything below drives /v1/realm/<slug>/... - the realm-scoped
   endpoints in panel.py.  The slug is always cur().slug, so which
   files get written follows the realm selected in the rail rather
   than whichever one the hub happens to have been built around.
   ================================================================== */

var PSTATE = {
  overview: null, settings: null, rates: null, trainer: null, bots: null, raid: null,
  modules: null,
  log: [], forSlug: null, busy: {}, tool: 'trainer', logTimer: null
};

function hesc(s){
  return String(s == null ? '' : s).replace(/[&<>"]/g, function(m){
    return ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'})[m];
  });
}
function num(n){ return String(n).replace(/\B(?=(\d{3})+(?!\d))/g, ','); }

function copyText(text){
  var done = function(){ toast(text + '   copied'); };
  if (navigator.clipboard && navigator.clipboard.writeText)
    navigator.clipboard.writeText(text).then(done, function(){ copyFallback(text, done); });
  else copyFallback(text, done);
}
function copyFallback(text, done){
  var ta = document.createElement('textarea');
  ta.value = text; ta.setAttribute('readonly','');
  ta.style.position = 'fixed'; ta.style.opacity = '0';
  document.body.appendChild(ta); ta.select();
  try { document.execCommand('copy'); done(); }
  catch(e){ toast('Press Ctrl+C: ' + text, true); }
  document.body.removeChild(ta);
}

/* Load everything the ported views need for one realm.  Called on selection
   change and after any action that could move a value. */
function loadPanel(slug, only){
  var want = only || ['overview','settings','rates','trainer','bots','raid','modules','log'];
  var jobs = [];
  if (PSTATE.forSlug !== slug){
    PSTATE.overview = PSTATE.settings = PSTATE.rates = null;
    PSTATE.trainer = PSTATE.bots = PSTATE.raid = PSTATE.modules = null;
    PSTATE.log = [];
    PSTATE.forSlug = slug;
  }
  function get(name, path, into){
    if (want.indexOf(name) < 0) return;
    jobs.push(api('/v1/realm/' + slug + '/' + path).then(function(d){
      if (PSTATE.forSlug === slug) PSTATE[into] = d;
    }, function(){}));
  }
  get('overview','overview','overview');
  get('settings','settings','settings');
  get('rates','rates','rates');
  get('trainer','trainer','trainer');
  get('bots','bots','bots');
  get('raid','raid','raid');
  get('modules','modules','modules');
  if (want.indexOf('log') >= 0){
    jobs.push(api('/v1/realm/' + slug + '/log?n=200').then(function(d){
      if (PSTATE.forSlug === slug) PSTATE.log = (d && d.lines) || [];
    }, function(){}));
  }
  return Promise.all(jobs);
}

function pdo(path, body, after){
  var p = cur(); if (!p) return;
  return api('/v1/realm/' + p.slug + '/' + path, body || {}).then(function(r){
    toast((r.log || []).join(' · ') || 'done', !r.ok);
    if (r.copy) copyText(r.copy);
    if (after) after(r);
    return r;
  });
}

/* ------------------------------------------------------------- server */
function authChip(hub){
  /* One chip for auth. A profile whose auth is a helper has no authserver.exe,
     so reading hub.authserver there reports "down" for a realm that is fine. */
  if (hub.usesAuthserver === false){
    var hs = hub.helpers || [];
    var allUp = hs.length > 0 && hs.every(function(h){ return h.up; });
    return ['Auth', allUp ? 'helper' : 'helper down', allUp ? 'on' : 'off'];
  }
  var up = !!(hub.authserver && hub.authserver.up);
  return ['Auth', up ? 'up' : 'down', up ? 'on' : 'off'];
}

function renderServer(){
  var v = $('view-server'), p = cur();
  v.innerHTML = '';
  if (!p) return;
  var w = el('div','wrap');
  var head = el('div','sectionhead');
  head.appendChild(el('h2','display', 'Server — ' + p.name));
  head.style.marginTop = '0';
  w.appendChild(head);

  var ov = PSTATE.overview || {};
  var st = PSTATE.settings || {};
  var g = el('div','grid cols');

  /* --- processes --- */
  var c1 = el('div','card');
  c1.appendChild(el('h3', null, 'Processes'));
  function stat(card, k, val, dotcls){
    var r = el('div','stat');
    r.appendChild(el('span','k', k));
    var vv = el('span','v');
    if (dotcls) vv.appendChild(el('span','dot ' + dotcls));
    vv.appendChild(el('span', null, String(val)));
    r.appendChild(vv);
    card.appendChild(r);
    return r;
  }
  function proc(card, label, o){
    var up = !!(o && o.up);
    stat(card, label, up ? ((o.ram_mb ? o.ram_mb + ' MB' : 'up')) : 'stopped',
         up ? 'on' : 'off');
  }
  proc(c1, 'MySQL', ov.mysql);
  var _hub = (typeof S !== 'undefined' && S.hub) || {};
  if (_hub.usesAuthserver === false){
    (_hub.helpers || []).forEach(function(h){
      stat(c1, h.label || h.name, h.up ? ('up \u00b7 :' + h.port) : 'down',
           h.up ? 'on' : 'off');
    });
  } else {
    proc(c1, 'Auth server', ov.authserver);
  }
  proc(c1, 'World server', ov.worldserver);
  stat(c1, 'World ready', ov.ready ? 'yes' : 'no', ov.ready ? 'on' : 'off');
  proc(c1, 'Ollama', ov.ollama);
  g.appendChild(c1);

  /* --- population + ports --- */
  var c2 = el('div','card');
  c2.appendChild(el('h3', null, 'Realm'));
  stat(c2, 'Active', ov.active ? 'yes' : 'no', ov.active ? 'on' : '');
  var pop = ov.population || {};
  stat(c2, 'Players online', pop.players == null ? '—' : pop.players);
  stat(c2, 'Bots online', pop.bots == null ? '—' : pop.bots);
  /* Ports are read from THIS profile's own configs, not the hub's hardcoded
     3724/8085/7878 - the Ascension archive runs its world on 8086 and used to show
     a closed world port while it was serving one.  "listening" means this realm is
     the listener; an open port owned by someone else is what STOPS it starting, and
     showing that as "listening" is how an idle profile used to look up. */
  var pd = ov.portDetail || {};
  var plabel = {auth: 'Auth', world: 'World', soap: 'SOAP'};
  Object.keys(pd).forEach(function(k){
    var p = pd[k];
    stat(c2, (plabel[k] || k) + ' port ' + p.port,
         p.mine ? 'listening' : (p.open ? 'held by another realm' : 'closed'),
         p.mine ? 'on' : (p.open ? 'warn' : 'off'));
  });
  if (ov.blockedBy) stat(c2, 'Cannot start', ov.blockedBy, 'warn');
  g.appendChild(c2);

  /* --- power --- */
  var c3 = el('div','card');
  c3.appendChild(el('h3', null, 'Power'));
  var busy = !!(S.job && S.job.state === 'running');
  var btns = el('div','rowbtns');
  function pbtn(label, act, cls, enabled){
    var b = el('button','mini' + (cls ? ' ' + cls : ''), label);
    b.disabled = busy || !enabled;
    b.onclick = function(){ doAction(act); };
    btns.appendChild(b);
  }
  if (!p.serverManaged){
    c3.appendChild(el('div','empty', p.name + ' does not manage a server.'));
  } else if (!p.active && !p.independent){
    pbtn('Switch to this realm', 'switch', '', true);
    c3.appendChild(btns);
    c3.appendChild(el('p', null,
      'Switching stops ' + ((S.byslug[(S.hub||{}).activeRealm]||{}).name || 'the running realm')
      + ' first; characters are saved before it goes down.')).style.fontSize = '12px';
  } else {
    pbtn('Start', 'start', '', !p.serverUp);
    pbtn('Restart', 'restart', '', p.serverUp);
    pbtn('Stop', 'stop', 'danger', p.serverUp);
    c3.appendChild(btns);
    if (p.independent)
      c3.appendChild(el('p', null,
        p.name + ' has its own ports and databases, so it starts and stops on its own - '
        + 'it never switches, and it does not take ' + activeName() + ' down.'))
        .style.fontSize = '12px';
    if (busy && S.job)
      c3.appendChild(el('p', null, (S.job.step || S.job.action) + '…')).style.fontSize = '12px';
  }
  g.appendChild(c3);

  /* --- clients --- a realm played by more than one client says so here, with the
     same buttons the footer carries, because this is the page you land on. */
  if ((p.launchers || []).length > 1){
    var c4 = el('div','card');
    c4.appendChild(el('h3', null, 'Clients'));
    var cbtns = el('div','rowbtns');
    p.launchers.forEach(function(L){
      var b = el('button','mini' + (L.exists ? '' : ' danger'), L.label);
      b.disabled = busy || !L.exists;
      b.onclick = function(){ doAction('launch', L.id); };
      cbtns.appendChild(b);
    });
    c4.appendChild(cbtns);
    p.launchers.forEach(function(L){
      if (L.note || !L.exists)
        c4.appendChild(el('p', null, L.label + ' - ' + (L.exists ? L.note : 'not installed')))
          .style.fontSize = '12px';
    });
    g.appendChild(c4);
  }
  w.appendChild(g);

  /* --- settings --- */
  var sh = el('div','sectionhead');
  sh.appendChild(el('h2','display','Settings'));
  var loc = el('span','eyebrow', st.configDir || '');
  sh.appendChild(loc);
  w.appendChild(sh);

  if (!st.configDirExists){
    w.appendChild(el('div','empty', p.name + ' has no config directory on disk yet.'));
  } else {
    var sg = el('div','grid cols');
    var sc = el('div','card');
    sc.appendChild(el('h3', null, 'Tunables'));
    (st.items || []).forEach(function(it){ sc.appendChild(knob(it)); });
    if (!(st.items || []).length)
      sc.appendChild(el('div','empty','Nothing tunable in this realm’s configs.'));
    sg.appendChild(sc);

    if ((st.missing || []).length){
      var mc = el('div','card');
      mc.appendChild(el('h3', null, 'Not applicable here'));
      st.missing.forEach(function(m){
        var r = el('div','stat');
        r.appendChild(el('span','k', m.label));
        r.appendChild(el('span','v', 'no ' + m.file));
        mc.appendChild(r);
      });
      mc.appendChild(el('p', null,
        'These belong to modules ' + p.name + ' does not run, so they are hidden '
        + 'rather than shown editing another realm’s file.')).style.fontSize = '12px';
      sg.appendChild(mc);
    }

    if ((st.phases || []).length){
      var pc = el('div','card');
      pc.appendChild(el('h3', null, 'Progression tier'));
      pc.appendChild(el('p', null,
        'Sets the bot level cap, the maps bots roam, and the auction house filters '
        + 'together — they must agree or the lowest silently wins.'))
        .style.fontSize = '12px';
      var pb = el('div','rowbtns');
      var LBL = {vanilla:'Vanilla (60)', tbc:'TBC (70)', wotlk:'WotLK (80)'};
      st.phases.forEach(function(ph){
        var b = el('button','mini', LBL[ph] || ph);
        if (ph === st.phase){ b.style.borderColor = 'var(--primary)'; b.style.color = 'var(--primary)'; }
        b.onclick = function(){
          if (!confirm('Set the progression tier to ' + (LBL[ph] || ph) + '?')) return;
          pdo('phase', {phase: ph}, function(){ loadPanel(p.slug, ['settings']).then(render); });
        };
        pb.appendChild(b);
      });
      pc.appendChild(pb);
      sg.appendChild(pc);
    }
    w.appendChild(sg);
  }

  /* --- log --- */
  var lh = el('div','sectionhead');
  lh.appendChild(el('h2','display','World log'));
  var rl = el('button','ghost','Refresh');
  rl.onclick = function(){ loadPanel(p.slug, ['log']).then(render); };
  lh.appendChild(rl);
  w.appendChild(lh);
  var box = el('div','log');
  box.style.maxHeight = '22rem';
  box.textContent = PSTATE.log.length ? PSTATE.log.join('\n') : 'No log lines yet.';
  w.appendChild(box);
  // Scroll to the newest line the way tail -f would leave it.
  setTimeout(function(){ box.scrollTop = box.scrollHeight; }, 0);

  v.appendChild(w);
}

/* Two different numbers, each kept in its own place:

     the gold reading  = what the SERVER is on right now. It does not move while
                         you drag, so the value you are tuning away from is never
                         lost off the screen;
     the box / slider  = what Save will write, pre-loaded with the value this
                         build SHIPPED.

   So a tuned knob opens reading gold 6 with 1 in the box: the world is running 6,
   and one press of Save on an untouched box puts it back to stock. Resetting a
   single setting is the case nobody can do from memory - the stock numbers live in
   .conf.dist files nobody reads - and it is now one click. */
function liveLabel(value, unit, tight){
  if (value == null || value === '') return '—';
  // A symbol belongs to its number ("1×"); a word trails it ("60000 ms").
  return tight ? value + unit : String(value) + (unit ? ' ' + unit : '');
}

/* One settings row: slider plus an exact number box, because a save interval
   of 900000 is not something anyone drags to accurately. */
function knob(it){
  var d = el('div','knob');
  var h = el('div','kh');
  h.appendChild(el('span','kn', it.label));
  var val = el('span','kv');
  h.appendChild(val);
  d.appendChild(h);
  var meta = it.confKey + '  ·  ' + it.file;
  // Keep the default readable after you have typed over the box.
  if (it.default != null) meta += '  ·  default ' + it.default;
  d.appendChild(el('div','kf', meta));

  var row = el('div','kr');
  var rng = document.createElement('input');
  rng.type = 'range';
  rng.min = it.min; rng.max = it.max; rng.step = it.step || 1;
  var box = document.createElement('input');
  box.type = 'number';
  box.min = it.min; box.max = it.max; box.step = it.step || 1;
  // Falls back to the live value when a build ships no .dist to read.
  var start = parseFloat(it.default != null ? it.default : it.value);
  if (!isNaN(start)){ rng.value = start; box.value = start; }
  val.textContent = liveLabel(it.value, it.unit);
  rng.oninput = function(){ box.value = rng.value; };
  box.oninput = function(){ rng.value = box.value; };
  var save = el('button','mini','Save');
  save.onclick = function(){
    save.disabled = true;
    pdo('setting', {key: it.key, value: box.value}, function(){
      save.disabled = false;
      var p = cur(); if (p) loadPanel(p.slug, ['settings']);
    });
  };
  row.appendChild(rng); row.appendChild(box); row.appendChild(save);
  d.appendChild(row);
  return d;
}

/* -------------------------------------------------------------- world */
function renderWorld(){
  var v = $('view-world'), p = cur();
  v.innerHTML = '';
  if (!p) return;
  var w = el('div','wrap');
  var head = el('div','sectionhead');
  head.style.marginTop = '0';
  head.appendChild(el('h2','display','World — ' + p.name));
  w.appendChild(head);

  var R = PSTATE.rates;
  if (!R){ w.appendChild(el('div','empty','Loading…')); v.appendChild(w); return; }
  if (!(R.groups || []).length){
    w.appendChild(el('div','empty', p.name + ' has no worldserver.conf to tune.'));
    v.appendChild(w); return;
  }

function rateKnob(it){
  var d = el('div','knob');
  var h = el('div','kh');
  h.appendChild(el('span','kn', it.label));
  var val = el('span','kv');
  h.appendChild(val);
  d.appendChild(h);
  /* Zero-width spaces after the dots so a key that has to wrap breaks at a
     segment boundary rather than in the middle of a word. */
  var meta = it.key.replace(/\./g, '.\u200B');
  if (it.default != null) meta += '  ·  default ' + it.default;
  d.appendChild(el('div','kf', meta));

  var row = el('div','kr');
  var box = document.createElement('input');
  box.type = 'number';
  box.min = it.min; box.max = it.max; box.step = (it.max <= 2 ? 0.05 : 0.1);
  // Pre-loaded with stock, same as the settings knobs: gold reads what the world
  // is on, the box reads what Save would write.
  box.value = (it.default != null ? it.default : (it.value == null ? '' : it.value));
  val.textContent = liveLabel(it.value, '×', true);
  var save = el('button','mini','Save');
  save.onclick = function(){
    save.disabled = true;
    pdo('rate', {key: it.key, value: box.value}, function(){
      save.disabled = false;
      var p = cur(); if (p) loadPanel(p.slug, ['rates']);
    });
  };
  row.appendChild(box);
  row.appendChild(save);
  d.appendChild(row);
  return d;
}

function renderTools(){
  var v = $('view-tools'), p = cur();
  v.innerHTML = '';
  if (!p) return;
  var w = el('div','wrap');
  var head = el('div','sectionhead');
  head.style.marginTop = '0';
  head.appendChild(el('h2','display','Tools — ' + p.name));
  w.appendChild(head);

  var tabs = el('div','subtabs');
  [['trainer','Trainer'], ['bots','Bots'], ['raid','Raid'],
   ['modules','Modules']].forEach(function(t){
    var b = el('button','subtab', t[1]);
    b.setAttribute('aria-selected', PSTATE.tool === t[0] ? 'true' : 'false');
    b.onclick = function(){ PSTATE.tool = t[0]; renderTools(); };
    tabs.appendChild(b);
  });

  if (PSTATE.tool === 'trainer') toolsTrainer(w, p);

}

/* ---- modules: on / paused / out -------------------------------------------
   Three states, with what each COSTS said before the click rather than after:
   nothing, one command to the running world, or a rebuild. The rules live in
   control/modules.py and are enforced there - a caveated pause comes back as a
   REFUSAL ("CONFIRM: ...") rather than being merely warned about here, so any
   other caller of the endpoint gets the same guard. */
function modBadge(m){
  var cls = 'badge' + (m.state === 'on' ? ' gold' : (m.state === 'out' ? ' hot' : ''));
  var b = el('span', cls, m.state.toUpperCase());
  if (m.state === 'paused'){ b.style.color = 'var(--warn)'; b.style.borderColor = 'rgba(244,176,55,.5)'; }
  return b;
}

function modCard(m, M, p){
  var c = el('div','card');

  var head = el('div');
  head.style.cssText = 'display:flex;align-items:flex-start;justify-content:space-between;gap:.6rem';
  var h = el('h3', null, m.label);
  h.style.margin = '0';
  head.appendChild(h);
  head.appendChild(modBadge(m));
  c.appendChild(head);

  var meta = el('div');
  meta.style.cssText = 'font-size:12px;color:var(--foreground-dim);margin:.6rem 0;line-height:1.6';
  meta.appendChild(el('div', null, m.dir));
  meta.appendChild(el('div', null, m.enableKey
    ? (m.enableKey + ' = ' + (m.enableValue == null ? '?' : m.enableValue) + '  ·  ' + m.conf)
    : 'no master Enable key — it can only be built out'));

  /* The whole point of the page: say what a toggle costs BEFORE it is clicked. */
  var cost = el('div', null, !m.canPause ? ''
    : (m.applyCmd ? ('pause applies with ' + m.applyCmd + (M.worldReady ? '' : ' — or at the next start'))
                  : 'pause needs a world restart'));
  cost.title = m.applyWhy || '';
  if (!m.applyCmd) cost.style.color = 'var(--warn)';
  meta.appendChild(cost);

  if (m.pending){
    var pd = el('div', null, m.pending === 'out'
      ? 'queued to leave the build — run tools\\rebuild.ps1 to apply'
      : 'queued to come back — run tools\\rebuild.ps1 to apply');
    pd.style.color = 'var(--warn)';
    meta.appendChild(pd);
  }
  c.appendChild(meta);

  var row = el('div','rowbtns');
  [['on','On'], ['paused','Pause'], ['out','Build out']].forEach(function(s){
    var b = el('button','mini', s[1]);
    if (s[0] === m.state){ b.style.borderColor = 'var(--primary)'; b.style.color = 'var(--primary)'; }
    if (s[0] === 'paused' && !m.canPause){
      b.disabled = true;
      b.title = m.enableKey ? (m.conf + ' is not in this realm’s module config directory')
                            : 'this module has no master Enable key';
    }
    if (s[0] === 'out' && !M.buildControl){
      b.disabled = true;
      b.title = 'this profile declares no build tree in profiles.json';
    }
    if (s[0] === 'out' && M.buildBusy){
      b.disabled = true;
      b.title = 'a build is running (' + M.buildBusyWhat + ')';
    }
    b.onclick = function(){
      var body = {dir: m.dir, state: s[0]};
      if (s[0] === 'paused' && m.caveat){
        if (!confirm(m.label + '\n\n' + m.caveat + '\n\nPause it anyway?')) return;
        body.confirm = true;      /* the server refuses without this */
      }
      if (s[0] === 'out' && !confirm(
          'Build ' + m.label + ' out of ' + p.name + '?\n\n'
          + 'Nothing is deleted — this writes ' + m.cmakeVar + '=disabled for the '
          + 'next configure. It takes a full rebuild (tools\\rebuild.ps1) to apply, '
          + 'and until then the module is still compiled in and still running.')) return;
      pdo('module', body, function(){ loadPanel(p.slug, ['modules']).then(render); });
    };
    row.appendChild(b);
  });
  c.appendChild(row);
  return c;
}

/* One command, its argument inputs, and the button that builds or runs it. */
function cmdCard(c, kind, ctxData){
  var card = el('div','cmdcard');
  var h = el('h4', null, c.label || c.id);
  var mode = (kind === 'bots' || kind === 'raid') ? 'copy' : (c.mode || 'copy');
  h.appendChild(el('span','mode ' + mode, mode === 'run' ? 'runs here' : 'copy'));
  card.appendChild(h);
  if (c.desc) card.appendChild(el('p', null, c.desc));
  if (c.tip) card.title = c.tip;

  var inputs = {};
  if ((c.args || []).length){
    var args = el('div','args');
    c.args.forEach(function(a){
      var lab = el('label', null, null);
      lab.appendChild(el('span', null, a.label || a.key));
      var inp;
      if (a.type === 'select'){
        inp = document.createElement('select');
        /* Only bots and raid selects may lead with a blank: control._cmd_build()
           drops an empty optional arg, but trainer_build() treats '' as absent
           and fails with "missing value: <label>" unless the arg carries a
           default.  The one trainer select (Destination) has none, so it must
           start on a real option rather than on an empty row that looks chosen. */
        if ((kind === 'bots' || kind === 'raid') && !a.req && a.default === undefined)
          inp.appendChild(new Option('', ''));
        (a.options || []).forEach(function(o){
          inp.appendChild(new Option(o.t, o.v));
        });
        if (a.default !== undefined) inp.value = a.default;
      } else {
        inp = document.createElement('input');
        inp.type = (a.type === 'number') ? 'number' : 'text';
        if (a.default !== undefined) inp.value = a.default;
        if (a.placeholder) inp.placeholder = a.placeholder;
      }
      lab.appendChild(inp);
      inputs[a.key] = inp;
      args.appendChild(lab);
    });
    card.appendChild(args);
  }

  var foot = el('div','foot');
  var go = el('button','mini', mode === 'run' ? 'Run' : 'Copy command');
  if (kind === 'trainer' && mode === 'run' && !(ctxData.active && ctxData.soapReady)){
    go.disabled = true;
    go.title = ctxData.active ? 'SOAP is not answering' : 'not the active realm';
  }
  go.onclick = function(){
    var vals = {};
    Object.keys(inputs).forEach(function(k){ vals[k] = inputs[k].value; });
    go.disabled = true;
    pdo(kind, {id: c.id, args: vals}, function(){ go.disabled = false; });
  };
  foot.appendChild(go);
  card.appendChild(foot);
  return card;
}
