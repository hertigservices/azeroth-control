var ROWH = 44, PAD = 8;
var RF = {data:null, loading:null, slug:null, cat:'items', q:'', f:{}, sort:0,
          results:[], sel:-1, lc:{}, wired:false};

function refCat(){
  for (var i = 0; i < CATS.length; i++) if (CATS[i].key === RF.cat) return CATS[i];
  return CATS[0];
}
/* An alternate client has no world DB of its own, so it reads the dataset of
   the realm it borrows.  Anything with no file yet falls back to refdata.json,
   which rebuild-refdata.py keeps as a copy of the active realm's. */
function refSlug(){
  var p = cur();
  return p ? (p.sharesRealm || p.slug) : null;
}
function refInvalidate(){
  if (RF.slug !== null && RF.slug === refSlug()) return;
  RF.data = null; RF.loading = null; RF.slug = null;
  RF.lc = {}; RF.results = []; RF.sel = -1;
}
function refEnsure(){
  if (RF.data) return Promise.resolve(RF.data);
  if (RF.loading) return RF.loading;
  var slug = refSlug();
  var url = slug ? '/refdata-' + encodeURIComponent(slug) + '.json' : '/refdata.json';
  RF.loading = fetch(url)
    .then(function(r){ return r.ok ? r : fetch('/refdata.json'); })
    .then(function(r){ if (!r.ok) throw new Error('no reference data'); return r.json(); })
    .then(function(d){ RF.data = d; RF.slug = slug; RF.loading = null; return d; },
          function(e){ RF.loading = null; throw e; });
  return RF.loading;
}
function refPresent(key, idx, names){
  var seen = {}, rows = (RF.data && RF.data[key]) || [], i;
  for (i = 0; i < rows.length; i++) seen[rows[i][idx]] = true;
  var out = [];
  for (var k in seen) if (seen.hasOwnProperty(k)) out.push(+k);
  out.sort(function(a,b){ return a-b; });
  return out.map(function(v){ return {v:v, t:(names[v] !== undefined ? names[v] : ('#'+v))}; });
}
function refNameIdx(key){
  if (RF.lc[key]) return RF.lc[key];
  var src = (RF.data && RF.data[key]) || [], out = new Array(src.length),
      isCmd = (key === 'commands');
  for (var i = 0; i < src.length; i++) out[i] = String(isCmd ? src[i][0] : src[i][1]).toLowerCase();
  RF.lc[key] = out;
  return out;
}
function refSearch(){
  var key = RF.cat, src = (RF.data && RF.data[key]) || [], term = RF.q.trim().toLowerCase();
  if (!term) return src.slice();
  var names = refNameIdx(key), pre = [], sub = [], i, p;
  if (/^\d+$/.test(term) && key !== 'commands'){
    var want = parseInt(term, 10), exact = [], partial = [];
    for (i = 0; i < src.length; i++){
      if (src[i][0] === want) exact.push(src[i]);
      else if (String(src[i][0]).indexOf(term) === 0) partial.push(src[i]);
    }
    for (i = 0; i < src.length; i++) if (names[i].indexOf(term) !== -1) sub.push(src[i]);
    return exact.concat(partial, sub);
  }
  for (i = 0; i < src.length; i++){
    p = names[i].indexOf(term);
    if (p === 0) pre.push(src[i]); else if (p > 0) sub.push(src[i]);
  }
  return pre.concat(sub);
}
function refFilter(rows){
  var c = refCat();
  (c.filters || []).forEach(function(f){
    if (f.kind === 'select'){
      var v = RF.f[f.id];
      if (v === undefined) return;
      rows = rows.filter(f.custom ? function(r){ return f.test(r, v); }
                                  : function(r){ return r[f.idx] === v; });
    } else if (f.kind === 'range'){
      var lo = RF.f[f.id + '_lo'], hi = RF.f[f.id + '_hi'];
      if (lo === undefined && hi === undefined) return;
      var a = f.idx, b = (f.idx2 !== undefined ? f.idx2 : f.idx);
      rows = rows.filter(function(r){
        if (lo !== undefined && r[b] < lo) return false;
        if (hi !== undefined && r[a] > hi) return false;
        return true;
      });
    }
  });
  return rows;
}
function refRecompute(){
  var c = refCat();
  var rows = refFilter(refSearch());
  var s = (c.sorts || [])[RF.sort];
  if (s && (RF.sort > 0 || !RF.q)) rows = rows.slice().sort(s.f);
  RF.results = rows;
  RF.sel = -1;
  var vp = $('refviewport');
  if (vp) vp.scrollTop = 0;
  refPaint();
}
function refActiveCount(){
  var n = 0;
  for (var k in RF.f) if (RF.f.hasOwnProperty(k) && RF.f[k] !== undefined) n++;
  return n;
}

/* ============================================================= item browser
   Ascension-only. The recovered item_template holds ~550k rows, so nothing is
   held client-side: every keystroke / filter / page hits the panel endpoint,
   which returns one 60-row window plus the total. State lives in IB; the shell
   is built once per realm and the 5s status poll is told to leave it alone. */
var IB = {
  slug:null, q:'', quality:'', cls:'', page:0,
  data:null, loading:false, seq:0,
  who:'', qty:1               // spawn recipient + count, shared by every row
};
/* WoW 3.3.5a ItemClass -> label, the categories James wants to browse by. */
var ITEM_CLASS = {
  0:'Consumable', 1:'Container', 2:'Weapon', 3:'Gem', 4:'Armor', 5:'Reagent',
  6:'Projectile', 7:'Trade Goods', 8:'Generic', 9:'Recipe', 10:'Money',
  11:'Quiver', 12:'Quest', 13:'Key', 14:'Permanent', 15:'Miscellaneous', 16:'Glyph'
};
var ITEM_QUALITY = {
  0:'Poor', 1:'Common', 2:'Uncommon', 3:'Rare', 4:'Epic', 5:'Legendary',
  6:'Artifact', 7:'Heirloom'
};
function ibReset(slug){
  IB.slug = slug; IB.q = ''; IB.quality = ''; IB.cls = '';
  IB.page = 0; IB.data = null; IB.loading = false; IB.who = ''; IB.qty = 1;
}

function renderItems(){
  var v = $('view-items'), p = cur();
  if (!p || !isAscension(p)){ v.innerHTML = ''; IB.slug = null; return; }
  // Built already for this realm?  The poll lands here every 5s; rebuilding
  // would wipe a half-typed search or reset the scroll, so bail early.
  if (IB.slug === p.slug && v.firstChild) return;
  ibReset(p.slug);
  v.innerHTML = '';

  var w = el('div','wrap');
  w.style.cssText = 'padding-top:1.2rem;padding-bottom:1.2rem';
  var head = el('div','sectionhead');
  head.style.marginTop = '0';
  head.appendChild(el('h2','display','Items'));
  head.appendChild(el('span','eyebrow',
    'Recovered Ascension item_template · spawn mails the item to a character'));
  w.appendChild(head);

  // search + category/quality filters
  var bar = el('div','toolbar');
  var search = el('div','search');
  search.appendChild(svg(ICON.search));
  var inp = document.createElement('input');
  inp.type = 'search';
  inp.placeholder = 'Search by name or item ID…';
  inp.value = IB.q;
  var deb;
  inp.oninput = function(){
    clearTimeout(deb);
    deb = setTimeout(function(){ IB.q = inp.value; IB.page = 0; loadItems(); }, 140);
  };
  search.appendChild(inp);
  bar.appendChild(search);

  bar.appendChild(ibSelect('Category', 'cls', ITEM_CLASS));
  bar.appendChild(ibSelect('Quality', 'quality', ITEM_QUALITY));
  w.appendChild(bar);

  // spawn bar: one recipient + qty shared by every row's Spawn button
  var sb = el('div','ibbar');
  sb.appendChild(el('span','lb','Send to'));
  var who = document.createElement('input');
  who.className = 'who'; who.type = 'text';
  who.placeholder = 'character name';
  who.value = IB.who;
  who.oninput = function(){ IB.who = who.value; };
  sb.appendChild(who);
  sb.appendChild(el('span','lb','Qty'));
  var qty = document.createElement('input');
  qty.className = 'qty'; qty.type = 'number'; qty.min = '1'; qty.max = '1000';
  qty.value = String(IB.qty);
  qty.oninput = function(){
    var n = parseInt(qty.value, 10);
    IB.qty = (isFinite(n) && n > 0) ? Math.min(n, 1000) : 1;
  };
  sb.appendChild(qty);
  var tip = el('span','tip');
  tip.id = 'ib-tip';
  sb.appendChild(tip);
  w.appendChild(sb);

  var count = el('div','ibcount'); count.id = 'ib-count';
  w.appendChild(count);

  var rw = el('div','ibwrap'); rw.id = 'ib-wrap';
  w.appendChild(rw);

  var pager = el('div','ibpager'); pager.id = 'ib-pager';
  w.appendChild(pager);
  v.appendChild(w);

  loadItems();
}

/* A labelled <select> whose options are a {value:label} map, wired to IB[key]. */
function ibSelect(label, key, map){
  var g = el('label','fgroup');
  g.appendChild(el('span', null, label));
  var s = document.createElement('select');
  s.appendChild(new Option('All', ''));
  Object.keys(map).forEach(function(k){
    var o = new Option(map[k], k);
    if (String(IB[key]) === String(k)) o.selected = true;
    s.appendChild(o);
  });
  s.onchange = function(){ IB[key] = s.value; IB.page = 0; loadItems(); };
  g.appendChild(s);
  return g;
}

function loadItems(){
  if (!IB.slug) return;
  var my = ++IB.seq;                       // guard against out-of-order responses
  IB.loading = true;
  var c = $('ib-count');
  if (c) c.innerHTML = 'Searching…';
  var qs = '?q=' + encodeURIComponent(IB.q)
         + '&quality=' + encodeURIComponent(IB.quality)
         + '&class=' + encodeURIComponent(IB.cls)
         + '&page=' + IB.page;
  api('/v1/realm/' + IB.slug + '/itembrowser' + qs).then(function(d){
    if (my !== IB.seq || S.view !== 'items') return;   // a newer query won
    IB.loading = false; IB.data = d || {};
    ibPaint();
  }, function(){
    if (my !== IB.seq) return;
    IB.loading = false;
    var cc = $('ib-count');
    if (cc) cc.textContent = 'Could not reach the item service.';
  });
}

function ibPaint(){
  var d = IB.data || {}, wrap = $('ib-wrap'), count = $('ib-count');
  if (!wrap || !count) return;
  var tip = $('ib-tip');
  if (d.error){
    count.textContent = '';
    wrap.innerHTML = '';
    wrap.appendChild(el('div','ibempty', String(d.error)));
    $('ib-pager').innerHTML = '';
    return;
  }
  var items = d.items || [], total = d.total || 0;
  var from = total ? (d.page * (d.pageSize || 60)) + 1 : 0;
  var to = d.page * (d.pageSize || 60) + items.length;
  var bits = '<b>' + num(total) + '</b> item' + (total === 1 ? '' : 's');
  if (total) bits += ' · showing ' + num(from) + '–' + num(to);
  count.innerHTML = bits;

  // spawn availability depends on a running world; say so once, in the tip
  if (tip){
    if (!d.active){
      tip.textContent = 'Start the realm to enable spawning';
      tip.style.color = 'var(--warn)';
    } else {
      var dflt = d.character ? ('defaults to ' + d.character) : 'type a character name';
      tip.textContent = 'Spawn mails the item · ' + dflt;
      tip.style.color = '';
    }
  }
  // seed the recipient box with whoever is online, only while it's untouched
  if (d.character && !IB.who){
    IB.who = d.character;
    var wb = document.querySelector('#view-items .ibbar .who');
    if (wb && wb.value === '') wb.value = d.character;
  }

  wrap.innerHTML = '';
  if (!items.length){
    wrap.appendChild(el('div','ibempty',
      total ? 'No items on this page.' : 'No items match this search.'));
  } else {
    var tbl = el('table','ibtbl');
    var thead = el('thead'), htr = el('tr');
    ['ID','Name','Category','iLvl','Req','Build',''].forEach(function(h, i){
      var th = el('th', null, h);
      if (i === 3 || i === 4) th.style.textAlign = 'right';
      htr.appendChild(th);
    });
    thead.appendChild(htr); tbl.appendChild(thead);
    var tb = el('tbody');
    items.forEach(function(it){ tb.appendChild(ibRow(it, d.active)); });
    tbl.appendChild(tb);
    wrap.appendChild(tbl);
  }
  ibPager(d);
}

function ibRow(it, active){
  var tr = el('tr');
  tr.appendChild(el('td','id', it.entry));
  var q = parseInt(it.quality, 10);
  var nm = el('td', 'nm' + (isFinite(q) ? ' q' + q : ''), it.name || '(no name)');
  nm.title = it.name || '';
  tr.appendChild(nm);
  var cls = parseInt(it.class, 10);
  var cat = ITEM_CLASS[cls] != null ? ITEM_CLASS[cls] : ('class ' + it.class);
  tr.appendChild(el('td','cat', cat));
  tr.appendChild(el('td','n', it.ilvl));
  tr.appendChild(el('td','n', it.reqlvl));
  var vb = el('td', null);
  var badge = el('span', 'ibvb' + (it.vb ? '' : ' off'), it.vb ? 'loaded' : 'NULL');
  badge.title = it.vb
    ? 'VerifiedBuild ' + it.vb + ' — loaded by the worldserver'
    : 'VerifiedBuild NULL — not loaded until the flip + restart';
  vb.appendChild(badge);
  tr.appendChild(vb);
  var act = el('td','act');
  var b = el('button','mini','Spawn');
  b.type = 'button';
  if (!active){ b.disabled = true; b.style.opacity = '.5'; b.style.cursor = 'not-allowed'; }
  b.onclick = function(){ ibSpawn(it, b); };
  act.appendChild(b);
  tr.appendChild(act);
  return tr;
}

function ibSpawn(it, btn){
  var who = (IB.who || '').trim();
  if (!who){
    toast('Type a character name to send the item to', true);
    var wb = document.querySelector('#view-items .ibbar .who');
    if (wb) wb.focus();
    return;
  }
  var old = btn.textContent;
  btn.disabled = true; btn.textContent = 'Mailing…';
  pdo('itemspawn', {entry: it.entry, count: IB.qty, char: who}).then(function(){
    btn.textContent = old; btn.disabled = false;
  }, function(){ btn.textContent = old; btn.disabled = false; });
}

function ibPager(d){
  var box = $('ib-pager');
  if (!box) return;
  box.innerHTML = '';
  var pages = Math.max(1, Math.ceil((d.total || 0) / (d.pageSize || 60)));
  if (pages <= 1) return;
  var prev = el('button','mini','‹ Prev'); prev.type = 'button';
  prev.disabled = d.page <= 0;
  prev.onclick = function(){ if (IB.page > 0){ IB.page--; loadItems(); } };
  var next = el('button','mini','Next ›'); next.type = 'button';
  next.disabled = d.page >= pages - 1;
  next.onclick = function(){ if (IB.page < pages - 1){ IB.page++; loadItems(); } };
  var lbl = el('span', null);
  lbl.innerHTML = 'Page <b>' + num(d.page + 1) + '</b> of <b>' + num(pages) + '</b>';
  box.appendChild(prev); box.appendChild(lbl); box.appendChild(next);
}

    deb = setTimeout(function(){ RF.q = inp.value; refRecompute(); refBuildFilters(); }, 90);
  };
  search.appendChild(inp);
  bar.appendChild(search);
  w.appendChild(bar);

  var filters = el('div','reffilters');
  filters.id = 'reffilters';
  w.appendChild(filters);

  var count = el('div','refcount');
  count.id = 'refcount';
  w.appendChild(count);

  var rw = el('div','refwrap');
  var vp = el('div', null);
  vp.id = 'refviewport';
  var spacer = el('div', null);
  spacer.id = 'refspacer';
  var rows = el('div', null);
  rows.id = 'refrows';
  vp.appendChild(spacer);
  vp.appendChild(rows);
  rw.appendChild(vp);
  w.appendChild(rw);
  v.appendChild(w);

  vp.addEventListener('scroll', function(){ if (RF.cat !== 'commands') refPaintRows(); });
  rows.addEventListener('click', function(e){
    var t = e.target.closest ? e.target.closest('.refrow, .refcmd .nm') : null;
    if (!t) return;
    if (t.classList.contains('nm')){ copyText(t.dataset.cmd); return; }
    var row = RF.results[+t.dataset.i];
    if (!row) return;
    RF.sel = +t.dataset.i;
    copyText(refCat().build(row));
    refPaintRows();
  });

  if (RF.data){
    refBuildFilters();
    refRecompute();
  } else {
    count.textContent = 'Loading reference data…';
    /* Chain the repaint only on the load path.  refEnsure() hands back an
       already-resolved promise once the 5.6 MB file is cached, so calling this
       unconditionally would re-enter renderReference() from its own then()
       as a microtask, forever, and wedge the tab before it paints a row. */
    refEnsure().then(function(){
      if (S.view !== 'reference') return;
      renderReference();   // repaint once, now that the tab counts exist
    }, function(){
      count.textContent = 'Could not load reference data for '
                        + ((cur() || {}).name || 'this profile');
    });
  }
  // Category switches call this directly, bypassing paint(); keep the signature
  // in step so the 5s poll does not rebuild the view out from under a search.
  VSIG.reference = sig([RF.cat, !!RF.data, RF.slug]);
}

function refBuildFilters(){
  var box = $('reffilters');
  if (!box || !RF.data) return;
  var c = refCat(), html = '';
  (c.filters || []).forEach(function(f){
    var opts = f.opts || (f.optsFrom ? refPresent(f.optsFrom[0], f.optsFrom[1], f.optsFrom[2]) : []);
    if (f.kind === 'select'){
      var o = '<option value="">All</option>';
      opts.forEach(function(x){
        o += '<option value="' + x.v + '"'
           + (String(RF.f[f.id]) === String(x.v) ? ' selected' : '') + '>'
           + hesc(x.t) + '</option>';
      });
      html += '<label class="fgroup"><span>' + hesc(f.label) + '</span>'
            + '<select data-f="' + f.id + '">' + o + '</select></label>';
    } else if (f.kind === 'range'){
      var lo = RF.f[f.id + '_lo'], hi = RF.f[f.id + '_hi'];
      html += '<div class="fgroup"><span>' + hesc(f.label) + '</span><div class="rangewrap">'
            + '<input type="number" min="0" placeholder="min" data-r="' + f.id + '_lo" value="'
            + (lo !== undefined ? lo : '') + '">'
            + '<b>to</b>'
            + '<input type="number" min="0" placeholder="max" data-r="' + f.id + '_hi" value="'
            + (hi !== undefined ? hi : '') + '"></div></div>';
    }
  });
  var so = '';
  (c.sorts || []).forEach(function(s, i){
    so += '<option value="' + i + '"' + (RF.sort === i ? ' selected' : '') + '>'
        + hesc(s.t) + '</option>';
  });
  html += '<label class="fgroup"><span>Sort by</span>'
        + '<select data-sort="1">' + so + '</select></label>';
  if (refActiveCount() > 0)
    html += '<button class="mini" type="button" data-reset="1">Reset filters</button>';
  box.innerHTML = html;
  if (box.dataset.wired) return;
  box.dataset.wired = '1';
  box.addEventListener('change', function(e){
    var t = e.target;
    if (t.dataset.sort){ RF.sort = +t.value; refRecompute(); return; }
    if (t.dataset.f !== undefined){
      if (t.value === '') delete RF.f[t.dataset.f]; else RF.f[t.dataset.f] = +t.value;
      refRecompute(); refBuildFilters(); return;
    }
    if (t.dataset.r !== undefined){
      if (t.value === '') delete RF.f[t.dataset.r]; else RF.f[t.dataset.r] = +t.value;
      refRecompute(); refBuildFilters();
    }
  });
  box.addEventListener('click', function(e){
    if (e.target.dataset && e.target.dataset.reset){
      RF.f = {}; RF.sort = 0; refRecompute(); refBuildFilters();
    }
  });
}

function refPaint(){
  var count = $('refcount');
  if (!count) return;
  var c = refCat(), n = RF.results.length;
  var tot = ((RF.data && RF.data[RF.cat]) || []).length;
  var bits = '<b>' + num(n) + '</b> of ' + num(tot) + ' ' + c.label.toLowerCase();
  if (RF.q) bits += ' matching &ldquo;' + hesc(RF.q) + '&rdquo;';
  if (refActiveCount()) bits += ' &middot; ' + refActiveCount() + ' filter'
                              + (refActiveCount() > 1 ? 's' : '') + ' active';
  count.innerHTML = bits;
  refPaintRows();
}

function refPaintRows(){
  var rows = $('refrows'), spacer = $('refspacer'), vp = $('refviewport');
  if (!rows || !vp) return;
  var c = refCat(), r = RF.results, n = r.length;

  if (RF.cat === 'commands'){
    spacer.style.height = '0';
    rows.style.transform = 'none';
    rows.style.position = 'static';
    if (!n){ rows.innerHTML = refEmpty(); return; }
    var lim = Math.min(n, 400), h = '<div class="refcmds">';
    for (var i = 0; i < lim; i++){
      var row = r[i], sec = row[1] < 4 ? row[1] : 3;
      h += '<div class="refcmd"><div class="h">'
         + '<span class="nm" data-cmd="' + hesc('.' + row[0]) + '">.' + hesc(row[0]) + '</span>'
         + '<span class="sec sec' + sec + '">'
         + (row[1] === 0 ? 'Player' : 'GM level ' + row[1]) + '</span></div>'
         + (row[2] ? '<p>' + hesc(row[2]) + '</p>' : '') + '</div>';
    }
    h += '</div>';
    if (n > lim) h += '<div class="empty">Showing the first ' + lim + ' of ' + num(n)
                    + '. Keep typing to narrow.</div>';
    rows.innerHTML = h;
    return;
  }

  rows.style.position = 'absolute';
  spacer.style.height = (n * ROWH) + 'px';
  if (!n){ rows.innerHTML = refEmpty(); rows.style.transform = 'none'; return; }
  var top = vp.scrollTop, vh = vp.clientHeight;
  var first = Math.max(0, Math.floor(top / ROWH) - PAD);
  var last = Math.min(n, Math.ceil((top + vh) / ROWH) + PAD);
  var out = '';
  for (var j = first; j < last; j++){
    var rw = r[j], chips = c.chips ? c.chips(rw) : [], ch = '';
    for (var k = 0; k < chips.length; k++){
      var cp = chips[k];
      if (!cp || !cp.t) continue;
      var stl = (cp.q !== undefined) ? ' style="color:var(--q' + cp.q + ')"' : '';
      ch += '<span class="rchip ' + (cp.cls || '') + '"' + stl + '>' + hesc(cp.t) + '</span>';
    }
    var ns = c.color ? ' style="color:' + c.color(rw) + '"' : '';
    out += '<div class="refrow' + (j === RF.sel ? ' sel' : '') + '" data-i="' + j + '">'
         + '<span class="id">' + rw[0] + '</span>'
         + '<span class="nm"' + ns + '>' + hesc(rw[1] || '(unnamed)') + '</span>'
         + '<span class="meta">' + ch + '</span>'
         + '<span class="cmd">' + hesc(c.build(rw)) + '</span></div>';
  }
  rows.innerHTML = out;
  rows.style.transform = 'translateY(' + (first * ROWH) + 'px)';
}

function refEmpty(){
  return '<div class="empty">Nothing matches. Try a shorter word, a numeric ID, '
       + 'or reset the filters.</div>';
}

boot();
})();
</script>
</body>
</html>
